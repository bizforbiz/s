<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Stash 공유 뷰어 (정적 페이지). 데이터는 전부 Apps Script API에서 받는다 — 이 파일에는 비밀값·공유 내용이 없다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline'; img-src https: data: blob:; connect-src https://script.google.com https://*.googleusercontent.com https://drive.usercontent.google.com; base-uri 'none'; form-action 'none'">
<title>Stash 공유</title>
<meta property="og:title" content="Stash 공유">
<meta property="og:description" content="받은 링크로 사진과 메모를 봅니다.">
<meta property="og:type" content="website">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<style>
  :root {
    --bg: #f6f5f2;
    --paper: #ffffff;
    --ink: #1f1f1f;
    --muted: #6b6b6b;
    --line: #e4e2dc;
    --accent: #1f1f1f;
    --memo-dot: #2e9d5b;
    --focus: #2b5bd7;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.6; -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; }
  a { color: var(--focus); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 16px 80px; }

  /* 상태 화면 */
  .state { max-width: 420px; margin: 16vh auto 0; text-align: center; padding: 0 8px; }
  .state h2 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  .state p { color: var(--muted); margin: 0 0 18px; }
  .pw-form { display: flex; gap: 8px; }
  .pw-form input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 11px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--paper);
  }
  .pw-form input:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
  .err { color: var(--danger); font-size: 14px; min-height: 1.6em; margin-top: 8px; }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--ink); animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); cursor: pointer; text-decoration: none;
    font-size: 14px; white-space: nowrap;
  }
  .btn:hover { border-color: #c9c6be; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.small { padding: 5px 10px; font-size: 13px; }

  /* 머리말 */
  header.top { margin-bottom: 22px; }
  header.top h1 { font-size: 24px; line-height: 1.35; margin: 0 0 4px; font-weight: 650; word-break: keep-all; overflow-wrap: anywhere; }
  header.top .sub { color: var(--muted); font-size: 14px; }

  /* 다운로드 막대 */
  .dlbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 10px 12px; margin-bottom: 14px; background: var(--paper);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .dlbar label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; margin-right: auto; }
  .dlstatus { width: 100%; font-size: 13px; color: var(--muted); }
  .dlstatus:empty { display: none; }
  .dlstatus .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 6px 0 2px; }
  .dlstatus .bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .2s; }
  .hint { font-size: 13px; color: var(--muted); background: #fbfaf7; border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 14px; }

  /* 번호 썸네일 인덱스 */
  .index { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 40px; }
  .cell {
    position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden; cursor: pointer; aspect-ratio: 1 / 1; display: block; padding: 0; text-align: left;
  }
  .cell:focus-visible { outline: 2px solid var(--focus); }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; background: #eeece7; }
  .cell .ph {
    width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; padding: 10px; color: var(--muted); font-size: 12px; text-align: center; background: #faf9f6;
  }
  .cell .ph .ico { font-size: 26px; line-height: 1; }
  .cell .ph .snip { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; word-break: break-all; color: var(--ink); }
  .cell .num {
    position: absolute; left: 6px; top: 6px; background: rgba(255,255,255,.92); color: var(--ink);
    font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 10px; font-variant-numeric: tabular-nums;
  }
  .cell .dot {
    position: absolute; right: 7px; top: 8px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--memo-dot); box-shadow: 0 0 0 2px #fff;
  }
  .cell .pick {
    position: absolute; right: 2px; bottom: 2px; width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .cell .pick input { width: 20px; height: 20px; margin: 0; cursor: pointer; accent-color: var(--ink); }
  .cell.picked { outline: 3px solid var(--ink); outline-offset: -3px; }

  /* 상세: 큰 이미지 왼쪽 / 메모 전문 오른쪽 */
  .item {
    display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 24px;
    padding: 26px 0; border-top: 1px solid var(--line); scroll-margin-top: 12px;
  }
  .item.solo { grid-template-columns: minmax(0, 1fr); }
  .item .media { display: flex; flex-direction: column; align-items: center; }
  .item .media img {
    max-width: 100%; max-height: 82vh; height: auto; display: block; border-radius: 6px;
    background: #eeece7; cursor: zoom-in;
  }
  .filebox {
    width: 100%; padding: 34px 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  }
  .filebox .ico { font-size: 40px; line-height: 1; }
  .filebox .fname { font-weight: 600; overflow-wrap: anywhere; }
  .filebox .fmeta { color: var(--muted); font-size: 13px; }
  .side { min-width: 0; }
  .side .head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .side .head .n { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .side .head .date { color: var(--muted); font-size: 13px; margin-right: auto; }
  .memo {
    white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal;
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
    font-size: 15px; line-height: 1.7;
  }
  .memo.empty { color: var(--muted); font-style: normal; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .links .src { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }

  .totop {
    position: fixed; right: 14px; bottom: 16px; z-index: 5; padding: 9px 13px; border-radius: 20px;
    background: var(--ink); color: #fff; border: 0; font-size: 13px; cursor: pointer; opacity: 0; pointer-events: none;
    transition: opacity .2s; box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  .totop.show { opacity: .9; pointer-events: auto; }

  /* 라이트박스 */
  .lb {
    position: fixed; inset: 0; z-index: 20; background: rgba(12,12,12,.94); display: none;
    align-items: center; justify-content: center; touch-action: pan-y pinch-zoom;
  }
  .lb.open { display: flex; }
  .lb img { max-width: 100vw; max-height: 100vh; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; }
  .lb .lbbtn {
    position: absolute; background: rgba(255,255,255,.12); color: #fff; border: 0; cursor: pointer;
    width: 46px; height: 46px; border-radius: 50%; font-size: 22px; line-height: 46px; text-align: center; padding: 0;
  }
  .lb .lbbtn:hover { background: rgba(255,255,255,.25); }
  .lb .prev { left: 12px; top: 50%; transform: translateY(-50%); }
  .lb .next { right: 12px; top: 50%; transform: translateY(-50%); }
  .lb .close { right: 12px; top: 12px; }
  .lb .count { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; color: #ddd; font-size: 13px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30;
    background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: .95; }

  @media (max-width: 720px) {
    .wrap { padding-top: 20px; }
    header.top h1 { font-size: 20px; }
    .index { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .item { grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 20px 0; }
    .item .media img { max-height: none; }
    .lb .prev, .lb .next { display: none; }   /* 폰은 스와이프 */
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="state"><div class="spinner"></div><p>불러오는 중…</p></div>
</div>
<button class="totop" id="totop" type="button">목록 ↑</button>
<div class="lb" id="lb" role="dialog" aria-modal="true">
  <img id="lbimg" alt="">
  <button class="lbbtn prev" id="lbprev" type="button" aria-label="이전">‹</button>
  <button class="lbbtn next" id="lbnext" type="button" aria-label="다음">›</button>
  <button class="lbbtn close" id="lbclose" type="button" aria-label="닫기">✕</button>
  <div class="count" id="lbcount"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // Stash 공유 서버(Apps Script 웹앱 /exec). 배포 주소가 바뀌면 여기만 고친다.
  var API_URL = 'https://script.google.com/macros/s/AKfycbxvFvuB0KAovb436Je0oa8GHBb_i7sbnfUE5Na1cSNyAgHAtRNK0wK7Bd1bIPnctEVjag/exec';
  var ID_RE = /^[A-Za-z0-9]{10}$/;
  var RETRIES = 4;         // 구글 echo 단계 되튐(실측 ~30%) — 같은 reqId로 재시도(서버가 중복 실행 안 함)

  var SHARE_ID = '';
  var TOKEN_KEY = '';
  var app = document.getElementById('app');
  var share = null;        // vOpen 결과
  var token = null;
  var picked = {};         // n → true (ZIP 선택)
  var busy = false;        // ZIP 진행 중
  var gen = 0;             // 화면 세대 — 주소(#)가 바뀔 때마다 +1. 옛 세대의 비동기 결과는 버린다(A→B→A도 구분)
  var lbList = [];         // 라이트박스 대상(이미지 항목)
  var lbPos = 0;

  /* ── 공통 ── */

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = String(text);
    return e;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  /* ── 서버 호출 ── */

  function newReqId() {
    var a = new Uint8Array(16);
    try { window.crypto.getRandomValues(a); }
    catch (e) { for (var i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256); }
    var s = '';
    for (var j = 0; j < a.length; j++) s += ('0' + a[j].toString(16)).slice(-2);
    return s;
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /** 한 번 보내기 → 응답 JSON(ok 필드 있는 객체). 끊김·HTML·시간 초과는 reject(재시도 대상). */
  function postOnce(body, timeoutMs) {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, timeoutMs) : null;
    // credentials:'omit' — 익명 호출. 구글 계정 여러 개 로그인 상태여도 열린다.
    // Content-Type text/plain — CORS 프리플라이트 없이 보내기 위함.
    return fetch(API_URL, {
      method: 'POST',
      body: body,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      credentials: 'omit',
      redirect: 'follow',
      cache: 'no-store',
      signal: ctl ? ctl.signal : undefined
    }).then(function (res) {
      return res.text();
    }).then(function (text) {
      var j;
      try { j = JSON.parse(text); } catch (e) { throw new Error('응답 형식 오류'); }   // 구글 HTML 페이지가 온 경우
      if (!j || typeof j !== 'object' || typeof j.ok !== 'boolean') throw new Error('응답 형식 오류');
      if (j.ok === false && j.code === 'busy') throw new Error('서버 처리 중');
      return j;
    }).then(function (j) {
      if (timer) clearTimeout(timer);
      return j;
    }, function (e) {
      if (timer) clearTimeout(timer);
      throw e;
    });
  }

  /**
   * action 호출 — 같은 본문(같은 reqId)을 겹쳐 보내고 먼저 온 정상 응답을 쓴다.
   * 구글 응답 전달 단계(echo)가 요청마다 들쭉날쭉하다(실측 2초~30초, 가끔 되튐·404).
   * 서버 실행은 보통 몇 초라, 응답이 HEDGE_MS 안에 안 오면 같은 요청을 하나 더 보낸다.
   * 같은 reqId라 서버는 이미 실행한 결과를 돌려주거나 부작용 없는 조회만 다시 하므로 안전하다.
   */
  var HEDGE_MS = 4000;      // 이 시간 안에 답이 없으면 같은 요청 하나 더
  var MAX_INFLIGHT = 3;     // 동시에 떠 있는 요청 상한
  function api(action, payload) {
    var body = {};
    for (var k in payload) if (Object.prototype.hasOwnProperty.call(payload, k)) body[k] = payload[k];
    body.action = action;
    body.reqId = newReqId();
    var text = JSON.stringify(body);
    var timeoutMs = action === 'vFile' ? 300000 : 90000;
    var maxTotal = RETRIES + 3;
    return new Promise(function (resolve, reject) {
      var done = false, sent = 0, inflight = 0, lastErr = null, hedgeTimer = null;
      var launch = function () {
        if (done || sent >= maxTotal || inflight >= MAX_INFLIGHT) return;
        sent++; inflight++;
        clearTimeout(hedgeTimer);
        hedgeTimer = setTimeout(launch, HEDGE_MS);
        postOnce(text, timeoutMs).then(function (j) {
          inflight--;
          if (done) return;
          done = true; clearTimeout(hedgeTimer); resolve(j);
        }, function (e) {
          inflight--;
          if (done) return;
          lastErr = e;
          if (sent >= maxTotal) {
            if (inflight === 0) { done = true; clearTimeout(hedgeTimer); reject(lastErr); }
            return;
          }
          // 실패하면 잠깐 쉬고 다시 (겹쳐 보낸 다른 요청이 아직 살아 있으면 그쪽도 계속 기다린다)
          setTimeout(launch, Math.min(1000 * sent, 3000));
        });
      };
      launch();
    });
  }

  function storeGet(k) { try { return window.sessionStorage.getItem(k); } catch (e) { return null; } }
  function storeSet(k, v) { try { window.sessionStorage.setItem(k, v); } catch (e) { /* 저장 불가 환경 무시 */ } }
  function storeDel(k) { try { window.sessionStorage.removeItem(k); } catch (e) { /* 무시 */ } }

  function pad(n) {
    var w = share && share.items.length > 999 ? 4 : 3;
    var s = String(n);
    while (s.length < w) s = '0' + s;
    return s;
  }
  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function fmtSize(b) {
    if (!b) return '';
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(0) + ' KB';
    return (b / 1048576).toFixed(1) + ' MB';
  }
  function isHttp(u) { return typeof u === 'string' && /^https?:\/\//i.test(u); }

  function thumbUrl(id) { return 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(id) + '=w400'; }
  function bigUrl(id) { return 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(id) + '=w1600'; }
  // 다운로드 비허용이면 라이트박스도 원본(=s0) 대신 큰 화면용 크기까지만
  function fullUrl(id) { return 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(id) + (share && share.allowDownload ? '=s0' : '=w2400'); }
  function fallbackUrl(id, w) { return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + w; }
  function dlUrl(id) { return 'https://drive.google.com/uc?export=download&id=' + encodeURIComponent(id); }

  /** lh3 실패 시 drive 썸네일로 한 번만 폴백 */
  function setImg(img, primary, id, w) {
    img.onerror = function () {
      img.onerror = null;
      img.src = fallbackUrl(id, w);
    };
    img.src = primary;
  }

  function isImage(it) { return it.kind === 'image' && !!it.fileId; }

  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  /* ── 상태 화면 ── */

  function stateScreen(title, sub, actionLabel, action) {
    clear(app);
    var box = el('div', 'state');
    box.appendChild(el('h2', null, title));
    if (sub) box.appendChild(el('p', null, sub));
    if (actionLabel) {
      var b = el('button', 'btn', actionLabel);
      b.type = 'button';
      b.onclick = action;
      box.appendChild(b);
    }
    app.appendChild(box);
  }

  function loading(msg) {
    clear(app);
    var box = el('div', 'state');
    box.appendChild(el('div', 'spinner'));
    box.appendChild(el('p', null, msg || '불러오는 중…'));
    app.appendChild(box);
  }

  function passwordScreen(errMsg) {
    clear(app);
    var box = el('div', 'state');
    box.appendChild(el('h2', null, '비밀번호가 필요합니다'));
    box.appendChild(el('p', null, '보내준 사람에게 받은 비밀번호를 입력하세요.'));
    var form = el('form', 'pw-form');
    var input = el('input');
    input.type = 'password';
    input.autocomplete = 'off';
    input.placeholder = '비밀번호';
    input.setAttribute('aria-label', '비밀번호');
    var btn = el('button', 'btn primary', '열기');
    btn.type = 'submit';
    form.appendChild(input);
    form.appendChild(btn);
    var err = el('div', 'err', errMsg || '');
    form.onsubmit = function (e) {
      e.preventDefault();
      var pw = input.value;
      if (!pw) { input.focus(); return; }
      btn.disabled = true;
      err.textContent = '';
      open(pw, null);
    };
    box.appendChild(form);
    box.appendChild(err);
    app.appendChild(box);
    setTimeout(function () { input.focus(); }, 50);
  }

  /* ── 열기 ── */

  function open(password, tok) {
    var id = SHARE_ID, myGen = gen;
    if (!password) loading();
    api('vOpen', { shareId: id, password: password || null, token: tok || null }).then(function (r) {
      if (myGen !== gen) return;   // 그 사이 주소(#)가 바뀜 — 옛 응답 버림
      if (!r || !r.ok) {
        stateScreen('불러오지 못했습니다', (r && r.error) || '잠시 후 다시 시도해 주세요.', '다시 시도', function () { open(null, token); });
        return;
      }
      switch (r.state) {
        case 'ready':
          token = r.token;
          storeSet(TOKEN_KEY, token);
          share = r;
          document.title = r.title || 'Stash 공유';
          render();
          break;
        case 'needPassword':
          storeDel(TOKEN_KEY);
          passwordScreen('');
          break;
        case 'badPassword':
          passwordScreen('비밀번호가 맞지 않습니다.');
          break;
        case 'rateLimited':
          // 공유 단위 잠금이라 다른 사람이 틀린 경우에도 걸린다 — 일시적임을 분명히
          passwordScreen('비밀번호 입력이 너무 많이 실패해 잠시 잠겼습니다. 10분쯤 뒤 다시 시도하세요(계속 막히면 보내준 사람에게 알려 주세요).');
          break;
        case 'expired':
          stateScreen('만료된 링크입니다', '공유 기간이 끝났습니다. 필요하면 보내준 사람에게 다시 요청하세요.');
          break;
        case 'building':
          stateScreen('준비 중…', '사진을 올리는 중입니다. 잠시 후 새로고침해 주세요.', '새로고침', function () { open(null, token); });
          break;
        default:
          stateScreen('링크를 찾을 수 없습니다', '삭제되었거나 주소가 잘못되었습니다.');
      }
    }).catch(function (e) {
      if (myGen !== gen) return;
      stateScreen('불러오지 못했습니다', '네트워크 상태를 확인한 뒤 다시 시도해 주세요.', '다시 시도', function () { open(null, token); });
      if (window.console) console.error(e);
    });
  }

  /* ── 본문 렌더 ── */

  function render() {
    clear(app);
    picked = {};
    var items = share.items || [];
    lbList = items.filter(isImage);

    // 머리말: 제목 · 개수 · 공유일 · 만료일
    var head = el('header', 'top');
    head.appendChild(el('h1', null, share.title || 'Stash 공유'));
    var sub = [items.length + '개 항목'];
    if (share.createdAt) sub.push(fmtDate(share.createdAt) + ' 공유');
    sub.push(share.expiresAt ? fmtDate(share.expiresAt) + '까지 열람 가능' : '기한 없음');
    head.appendChild(el('div', 'sub', sub.join(' · ')));
    app.appendChild(head);

    if (!items.length) {
      app.appendChild(el('p', 'sub', '공유된 항목이 없습니다.'));
      return;
    }

    if (share.allowDownload) app.appendChild(buildDlBar(items));

    // 번호 썸네일 인덱스
    var idx = el('div', 'index');
    items.forEach(function (it) { idx.appendChild(buildCell(it)); });
    app.appendChild(idx);

    // 한 장씩 상세
    items.forEach(function (it) { app.appendChild(buildDetail(it)); });
  }

  function buildDlBar(items) {
    var frag = document.createDocumentFragment();
    if (/KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent || '')) {
      frag.appendChild(el('div', 'hint',
        '앱 안 브라우저에서는 묶음(ZIP) 다운로드가 안 될 수 있습니다. 오른쪽 위 메뉴의 "다른 브라우저로 열기"를 이용하거나 항목별 "원본 받기"를 누르세요.'));
    }
    var bar = el('div', 'dlbar');
    var allLabel = el('label');
    var all = el('input');
    all.type = 'checkbox';
    all.id = 'pickAll';
    allLabel.appendChild(all);
    allLabel.appendChild(document.createTextNode('전체 선택'));
    all.onchange = function () {
      items.forEach(function (it) { if (all.checked) picked[it.n] = true; else delete picked[it.n]; });
      syncPicks();
    };
    var selBtn = el('button', 'btn', '선택 ZIP');
    selBtn.type = 'button';
    selBtn.id = 'zipSel';
    selBtn.disabled = true;
    selBtn.onclick = function () {
      makeZip(items.filter(function (it) { return picked[it.n]; }), false);
    };
    var allBtn = el('button', 'btn primary', '전체 ZIP');
    allBtn.type = 'button';
    allBtn.id = 'zipAll';
    allBtn.onclick = function () { makeZip(items, true); };
    var st = el('div', 'dlstatus');
    st.id = 'dlstatus';
    bar.appendChild(allLabel);
    bar.appendChild(selBtn);
    bar.appendChild(allBtn);
    bar.appendChild(st);
    frag.appendChild(bar);
    return frag;
  }

  function syncPicks() {
    var count = 0;
    var items = share.items;
    items.forEach(function (it) {
      var on = !!picked[it.n];
      if (on) count++;
      var cell = document.getElementById('c-' + it.n);
      if (cell) {
        cell.classList.toggle('picked', on);
        var cb = cell.querySelector('input');
        if (cb) cb.checked = on;
      }
    });
    var sel = document.getElementById('zipSel');
    if (sel) {
      sel.textContent = count ? '선택 ZIP (' + count + ')' : '선택 ZIP';
      sel.disabled = busy || !count;
    }
    var all = document.getElementById('pickAll');
    if (all) all.checked = count > 0 && count === items.length;
  }

  function buildCell(it) {
    var cell = el('div', 'cell');
    cell.id = 'c-' + it.n;
    cell.tabIndex = 0;
    cell.setAttribute('role', 'button');
    cell.setAttribute('aria-label', pad(it.n) + '번으로 이동');

    if (isImage(it)) {
      var img = el('img');
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      setImg(img, thumbUrl(it.fileId), it.fileId, 400);
      cell.appendChild(img);
    } else if (it.kind === 'text') {
      var ph = el('div', 'ph');
      ph.appendChild(el('div', 'snip', (it.memo || '').slice(0, 120) || '(메모)'));
      cell.appendChild(ph);
    } else {
      var ph2 = el('div', 'ph');
      ph2.appendChild(el('div', 'ico', '📄'));
      ph2.appendChild(el('div', 'snip', displayName(it)));
      cell.appendChild(ph2);
    }

    cell.appendChild(el('span', 'num', pad(it.n)));
    if (share.showMemo && it.memo) {
      var dot = el('span', 'dot');
      dot.title = '메모 있음';
      cell.appendChild(dot);
    }

    if (share.allowDownload) {
      var pick = el('label', 'pick');
      var cb = el('input');
      cb.type = 'checkbox';
      cb.setAttribute('aria-label', pad(it.n) + '번 선택');
      pick.appendChild(cb);
      pick.onclick = function (e) { e.stopPropagation(); };
      cb.onchange = function () {
        if (cb.checked) picked[it.n] = true; else delete picked[it.n];
        syncPicks();
      };
      cell.appendChild(pick);
    }

    var go = function () {
      var target = document.getElementById('i-' + it.n);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    cell.onclick = go;
    cell.onkeydown = function (e) { if (e.key === 'Enter') go(); };
    return cell;
  }

  /** 표시용 파일명: "001_abc.png" → "abc.png" */
  function displayName(it) {
    var nm = it.name || '';
    return nm.replace(/^\d{3,4}_/, '') || '파일';
  }

  function buildDetail(it) {
    var sec = el('section', 'item');
    sec.id = 'i-' + it.n;
    var hasMedia = it.kind !== 'text' && !!it.fileId;
    var hasSide = share.showMemo || it.kind === 'text' || hasMedia;

    if (hasMedia) {
      var media = el('div', 'media');
      if (isImage(it)) {
        var img = el('img');
        img.alt = pad(it.n);
        img.loading = 'lazy';
        img.decoding = 'async';
        if (it.width && it.height) { img.width = it.width; img.height = it.height; }
        setImg(img, bigUrl(it.fileId), it.fileId, 1600);
        img.onclick = function () { openLb(it.n); };
        media.appendChild(img);
      } else {
        var fb = el('div', 'filebox');
        fb.appendChild(el('div', 'ico', '📄'));
        fb.appendChild(el('div', 'fname', displayName(it)));
        var fm = [it.mime, fmtSize(it.size)].filter(Boolean).join(' · ');
        if (fm) fb.appendChild(el('div', 'fmeta', fm));
        if (share.allowDownload) {
          var a = el('a', 'btn primary', '파일 받기');
          a.href = dlUrl(it.fileId);
          a.target = '_blank';
          a.rel = 'noopener';
          fb.appendChild(a);
        }
        media.appendChild(fb);
      }
      sec.appendChild(media);
    }

    if (hasSide) {
      var side = el('div', 'side');
      var hd = el('div', 'head');
      hd.appendChild(el('span', 'n', pad(it.n)));
      hd.appendChild(el('span', 'date', it.createdAt || ''));
      side.appendChild(hd);

      if (share.showMemo || it.kind === 'text') {
        if (it.memo) {
          var copy = el('button', 'btn small', '메모 복사');
          copy.type = 'button';
          copy.onclick = function () { copyText(it.memo); };
          hd.appendChild(copy);
          side.appendChild(el('div', 'memo', it.memo));   // 전문 — 잘라내지 않음
        } else {
          side.appendChild(el('div', 'memo empty', '메모 없음'));
        }
      }

      var links = el('div', 'links');
      if (share.allowDownload && hasMedia && isImage(it)) {
        var dl = el('a', 'btn small', '원본 받기');
        dl.href = dlUrl(it.fileId);
        dl.target = '_blank';
        dl.rel = 'noopener';
        links.appendChild(dl);
        if (it.size) links.appendChild(el('span', 'src', fmtSize(it.size)));
      }
      if (isHttp(it.sourceUrl)) {
        var src = el('a', 'src', '출처: ' + it.sourceUrl);
        src.href = it.sourceUrl;
        src.target = '_blank';
        src.rel = 'noopener noreferrer';
        links.appendChild(src);
      }
      if (links.firstChild) side.appendChild(links);
      sec.appendChild(side);
    }

    if (!hasMedia || !hasSide) sec.classList.add('solo');
    return sec;
  }

  /* ── 메모 복사 ── */

  function copyText(text) {
    var done = function () { toast('메모를 복사했습니다'); };
    var fallback = function () {
      var ta = el('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      toast(ok ? '메모를 복사했습니다' : '복사하지 못했습니다. 길게 눌러 직접 선택해 주세요.');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  /* ── 라이트박스 ── */

  var lb = document.getElementById('lb');
  var lbImg = document.getElementById('lbimg');

  function openLb(n) {
    for (var i = 0; i < lbList.length; i++) if (lbList[i].n === n) { lbPos = i; break; }
    showLb();
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function showLb() {
    var it = lbList[lbPos];
    if (!it) return;
    lbImg.removeAttribute('src');
    setImg(lbImg, fullUrl(it.fileId), it.fileId, 2400);
    document.getElementById('lbcount').textContent = pad(it.n) + '  ·  ' + (lbPos + 1) + ' / ' + lbList.length;
  }
  function moveLb(d) {
    if (lbList.length < 2) return;
    lbPos = (lbPos + d + lbList.length) % lbList.length;
    showLb();
  }
  function closeLb() {
    lb.classList.remove('open');
    lbImg.removeAttribute('src');
    document.body.style.overflow = '';
    var it = lbList[lbPos];
    var target = it && document.getElementById('i-' + it.n);
    if (target) target.scrollIntoView({ block: 'start' });
  }
  document.getElementById('lbprev').onclick = function (e) { e.stopPropagation(); moveLb(-1); };
  document.getElementById('lbnext').onclick = function (e) { e.stopPropagation(); moveLb(1); };
  document.getElementById('lbclose').onclick = function (e) { e.stopPropagation(); closeLb(); };
  lb.onclick = function (e) { if (e.target === lb) closeLb(); };
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    else if (e.key === 'ArrowLeft') moveLb(-1);
    else if (e.key === 'ArrowRight') moveLb(1);
  });
  // 스와이프 — 한 손가락 가로 이동만(두 손가락 확대는 무시)
  var tx = null, ty = null;
  lb.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    if (tx === null || !e.changedTouches.length) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    tx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) moveLb(dx < 0 ? 1 : -1);
    else if (dy > 90 && Math.abs(dy) > Math.abs(dx) * 1.5) closeLb();   // 아래로 쓸어내리면 닫기
  }, { passive: true });

  /* ── 목록으로 ── */

  var totop = document.getElementById('totop');
  totop.onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); };
  window.addEventListener('scroll', function () {
    totop.classList.toggle('show', window.scrollY > 600);
  }, { passive: true });

  /* ── ZIP 묶음 다운로드 ── */

  function setStatus(text, ratio) {
    var st = document.getElementById('dlstatus');
    if (!st) return;
    clear(st);
    if (text == null) return;
    st.appendChild(document.createTextNode(text));
    if (ratio != null) {
      var bar = el('div', 'bar');
      var fill = el('i');
      fill.style.width = Math.round(Math.max(0, Math.min(1, ratio)) * 100) + '%';
      bar.appendChild(fill);
      st.appendChild(bar);
    }
  }

  function setBusy(on) {
    busy = on;
    var a = document.getElementById('zipAll');
    if (a) a.disabled = on;
    syncPicks();
  }

  function safeFileName(s) {
    return String(s || 'Stash 공유').replace(/[\\/:*?"<>|\r\n\t]+/g, ' ').trim().slice(0, 80) || 'Stash 공유';
  }

  function makeZip(list, isAll) {
    if (busy || !list.length) return;
    if (!window.JSZip) {
      setStatus('압축 기능을 불러오지 못했습니다. 항목별 "원본 받기"를 이용하세요.');
      return;
    }
    setBusy(true);
    var zip = new window.JSZip();
    var withFile = list.filter(function (it) { return it.fileId && it.kind !== 'text'; });
    var failed = [];
    var memoTxt = '';
    if (share.showMemo) {
      list.forEach(function (it) { if (it.memo) memoTxt += pad(it.n) + '\n' + it.memo + '\n\n'; });
    }

    var sid = SHARE_ID, tok = token, cur = share;   // 도중에 주소(#)가 바뀌어도 이 공유 기준으로
    var myGen = gen;   // 주소가 바뀌면 이 작업은 조용히 멈춘다 — 새 화면의 상태 막대·busy를 건드리지 않는다
    var stale = function () { return myGen !== gen; };
    // 원본은 구글 파일 서버에서 직접 받는다(원본 바이트 그대로, CORS 허용, 1초 안팎).
    // 안 되면(큰 파일 바이러스 검사 안내 페이지 등) 공유 서버 vFile로 폴백. 3개씩 동시에.
    var doneCount = 0;
    var fetchDirect = function (it) {
      var url = 'https://drive.usercontent.google.com/download?id=' + encodeURIComponent(it.fileId) + '&export=download&confirm=t';
      return fetch(url, { credentials: 'omit', cache: 'no-store' }).then(function (res) {
        var ct = (res.headers.get('Content-Type') || '').toLowerCase();
        if (!res.ok || ct.indexOf('text/html') >= 0) throw new Error('direct ' + res.status);
        return res.arrayBuffer();
      });
    };
    var one = function (it) {
      // 파일명의 '/'·'\'는 ZIP 안에서 폴더가 되므로 바꾼다
      var fname = function (n) { return '원본/' + String(n || it.name || pad(it.n)).replace(/[\\/]+/g, '_'); };
      return fetchDirect(it).then(function (buf) {
        if (!stale()) zip.file(fname(it.name), buf);
      }).catch(function () {
        if (stale()) return;
        return api('vFile', { shareId: sid, token: tok, n: it.n }).then(function (r) {
          if (r && r.ok) zip.file(fname(r.name), r.b64, { base64: true });
          else failed.push(pad(it.n) + (r && r.error ? ' (' + r.error + ')' : ''));
        }, function () { failed.push(pad(it.n)); });
      }).then(function () {
        doneCount++;
        if (!stale()) setStatus('원본 받는 중… ' + doneCount + ' / ' + withFile.length, doneCount / Math.max(1, withFile.length));
      });
    };
    var next = 0;
    var worker = function () {
      if (next >= withFile.length || stale()) return Promise.resolve();
      var it = withFile[next++];
      return one(it).then(worker);
    };
    setStatus('원본 받는 중… 0 / ' + withFile.length, 0);

    Promise.all([worker(), worker(), worker()]).then(function () {
      if (stale()) return null;
      if (memoTxt) zip.file('메모.txt', '﻿' + memoTxt);
      if (withFile.length - failed.length === 0 && !memoTxt) throw new Error('받을 파일이 없습니다.');
      setStatus('압축 중…', 0);
      return zip.generateAsync({ type: 'blob' }, function (m) { if (!stale()) setStatus('압축 중… ' + Math.round(m.percent) + '%', m.percent / 100); });
    }).then(function (blob) {
      if (!blob || stale()) return;
      var name = safeFileName(cur.title) + (isAll ? '' : ' (선택 ' + list.length + '개)') + '.zip';
      saveBlob(blob, name, failed);
    }).catch(function (e) {
      if (stale()) return;
      setStatus('묶음을 만들지 못했습니다' + (e && e.message ? ': ' + e.message : '') + '. 항목별 "원본 받기"를 이용하세요.');
    }).then(function () { if (!stale()) setBusy(false); });
  }

  function saveBlob(blob, name, failed) {
    var st = document.getElementById('dlstatus');
    var url;
    try { url = URL.createObjectURL(blob); } catch (e) { url = null; }
    if (!url) {
      setStatus('이 브라우저에서는 묶음 저장이 안 됩니다. 항목별 "원본 받기"를 이용하세요.');
      return;
    }
    var a = el('a');
    a.href = url;
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    try { a.click(); } catch (e) { /* 아래 수동 링크로 폴백 */ }
    document.body.removeChild(a);

    setStatus(null);
    st.appendChild(document.createTextNode('ZIP 준비 완료 (' + fmtSize(blob.size) + '). '));
    var again = el('a', null, '저장이 안 되면 여기를 누르세요');
    again.href = url;
    again.download = name;
    st.appendChild(again);
    st.appendChild(el('div', null, '그래도 안 되면(앱 안 브라우저 등) 다른 브라우저로 열거나 항목별 "원본 받기"를 이용하세요.'));
    if (failed.length) st.appendChild(el('div', 'err', '빠진 항목 ' + failed.length + '개: ' + failed.join(', ')));
    // blob URL은 수동 링크용으로 잠시 유지 후 해제
    setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) { /* 무시 */ } }, 10 * 60 * 1000);
  }

  /* ── 시작 ── */

  /** 주소에서 공유 ID: #<id> (기본 — 서버 로그에 안 남음), ?s=<id>도 받아 준다 */
  function readId() {
    var h = (location.hash || '').replace(/^#/, '');
    try { h = decodeURIComponent(h); } catch (e) { /* 그대로 */ }
    h = h.replace(/^s=/, '').trim();
    if (ID_RE.test(h)) return h;
    var m = /[?&]s=([^&#]*)/.exec(location.search || '');
    var q = m ? m[1] : '';
    return ID_RE.test(q) ? q : '';
  }

  function start() {
    var id = readId();
    if (lb.classList.contains('open')) closeLb();
    gen++;   // 진행 중인 vOpen·ZIP 결과는 이제 무시된다
    share = null; token = null; picked = {}; lbList = []; busy = false;
    document.title = 'Stash 공유';
    window.scrollTo(0, 0);
    SHARE_ID = id;
    if (!id) {
      TOKEN_KEY = '';
      stateScreen('링크가 올바르지 않습니다', '보내준 사람에게 링크를 다시 확인해 달라고 해 주세요.');
      return;
    }
    TOKEN_KEY = 'stash_tok_' + id;
    open(null, storeGet(TOKEN_KEY));
  }

  window.addEventListener('hashchange', function () {
    if (readId() !== SHARE_ID) start();
  });
  start();
})();
</script>
</body>
