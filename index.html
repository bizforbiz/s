  }

  function mountCell(e) {
    if (e.cell || !entries[e.key]) return;
    var ref = nextMounted(e);
    var node = buildCell(e);
    e.g.grid.insertBefore(node, ref);
    if (pendingScroll === e.key) { pendingScroll = null; node.scrollIntoView({ block: 'nearest' }); }
  }

  /** 머리말 개수·묶음 개수·라이트박스 목록·ZIP 버튼·선택 상태·상세 패널 — 항목이 늘거나 번호가 바뀔 때마다 */
  function refreshMeta() {
    var order = [];
    groups.forEach(function (g) { g.entries.forEach(function (e) { order.push(e.it); }); });
    share.order = order;
    var items = share.items;
    var grouped = groups.length > 1;

    var sub = [items.length + '개 항목'];
    if (grouped) sub.push(groups.length + '개 분류');
    if (share.createdAt) sub.push(fmtDate(share.createdAt) + ' 공유');
    sub.push(share.expiresAt ? fmtDate(share.expiresAt) + '까지 열람 가능' : '기한 없음');
    if (hdrSub) hdrSub.textContent = sub.join(' · ');

    groups.forEach(function (g) {
      var t = '· ' + g.entries.length;
      var c = g.head && g.head.querySelector('.gcnt');
      if (c && c.textContent !== t) c.textContent = t;
    });

    // 라이트박스: 보고 있던 사진을 그대로 유지한 채 목록만 바꾼다
    // (실시간 공유에서 보던 사진이 빠졌으면 옆 사진으로, 남은 사진이 없으면 닫는다)
    var cur = lb.classList.contains('open') ? lbList[lbPos] : null;
    lbList = order.filter(isImage);
    if (cur) {
      var p = lbList.indexOf(cur);
      if (p >= 0) {
        lbPos = p;
        updateLbCount();
      } else if (lbList.length) {
        lbPos = Math.min(lbPos, lbList.length - 1);
        showLb();
      } else {
        closeLb();
      }
    }

    var za = document.getElementById('zipAll');
    if (za) za.textContent = zipAllLabel(order);
    if (share.allowDownload) syncPicks();

    // 고른 항목이 빠졌으면 옆 항목으로(없으면 패널 비움), 그대로면 위치(3 / 68)만
    if (panelEl) {
      if (selKey && !entries[selKey]) {
        var next = order[Math.min(selIndexHint, order.length - 1)];
        selKey = null;
        if (next) selectItem(next._k, {});
        else renderPanel();
      } else {
        updatePanelPos();
      }
    }
  }

  /** 번호가 바뀐 항목의 글자만 바꾼다(노드 유지) */
  function relabel(e) {
    var it = e.it, p = pad(it.n);
    if (e.cell) {
      e.cell.setAttribute('aria-label', p + '번 ' + cardName(it));
      if (e.numEl && e.numEl.textContent !== p) e.numEl.textContent = p;
      if (e.fnEl) e.fnEl.textContent = displayName(it);
    }
    if (e.key === selKey) renderPanel();
  }

  /** 화면에 그리는 내용 — 이게 바뀌면 그 카드를 새로 만든다(번호·이름만 바뀌면 글자만 고침) */
  function renderSig(it) {
    return [it.kind, it.fileId || '', it.memo || '', it.sourceUrl || '', it.createdAt || '',
            it.width || 0, it.height || 0, it.mime || '', it.size || 0].join('\u001f');
  }

  /**
   * 다시 읽은 목록을 화면에 합친다(업로드 중 이어 붙이기 · 실시간 공유 갱신) — 그대로인 카드는 다시 만들지 않는다.
   *  - 새 항목: n 순 자리에 끼움 · 번호만 바뀐 항목: 글자만 고침
   *  - 빠진 항목(실시간 공유에서 삭제·이동): 카드 제거 · 메모 등이 바뀐 항목: 그 카드만 새로 만듦
   *  - 분류가 바뀐 항목: 다른 묶음으로 옮김 · 순서가 바뀐 항목: 카드를 옮김(새로 만들지 않음)
   * 보던 위치는 화면 위쪽 1/3 지점 카드를 기준으로 그대로 둔다. 반환: {added, removed, updated} (전체 다시 그림이면 full)
   */
  function mergeShare(d) {
    if ((d.allowDownload !== false) !== share.allowDownload || (d.showMemo !== false) !== share.showMemo || !galWrap) {
      // 보기 설정이 바뀜(드묾)·처음엔 비어 있던 공유 → 처음부터 다시 그린다
      var y = window.scrollY;
      var before = Object.keys(entries).length;
      showShare(d, false);
      window.scrollTo(0, y);
      return { full: true, added: Math.max(0, share.items.length - before), removed: 0, updated: 0 };
    }
    if ((d.title || '') !== share.title) {
      share.title = d.title || '';
      if (titleEl) titleEl.textContent = share.title || 'Stash 공유';
      document.title = share.title || 'Stash 공유';
    }
    share.expiresAt = d.expiresAt || null;

    var incoming = (d.items || []).filter(function (x) { return x && typeof x === 'object'; });
    if (!incoming.length && Object.keys(entries).length) {
      // 전부 빠짐 → '항목 없음' 화면으로 다시 그린다
      var gone = Object.keys(entries).length;
      showShare(d, false);
      return { full: true, added: 0, removed: gone, updated: 0 };
    }

    rememberSelIndex();
    var anchor = captureAnchor();
    var seen = {}, added = [], moved = [], rebuilt = [], removed = 0, regrouped = false;
    incoming.forEach(function (raw) {
      var key = itemKey(raw);
      if (seen[key]) return;   // 같은 키가 두 번(있으면 안 됨) — 첫 것만
      seen[key] = true;
      var e = entries[key];
      if (!e) { added.push(addEntry(raw)); return; }
      var it = e.it;
      var sigChanged = renderSig(it) !== renderSig(raw);
      var numChanged = it.n !== raw.n || it.name !== raw.name;
      var label = catLabel(raw);
      // 같은 객체를 고쳐 쓴다 — 버튼·라이트박스 클로저가 들고 있는 it이 새 번호·이름·메모를 보게
      for (var k in raw) if (Object.prototype.hasOwnProperty.call(raw, k)) it[k] = raw[k];
      if (label !== e.g.label) { moveEntry(e, label); regrouped = true; }
      if (sigChanged) rebuilt.push(e);
      else if (numChanged) moved.push(e);
    });
    Object.keys(entries).forEach(function (k) {
      if (!seen[k]) { removeEntry(entries[k]); removed++; }
    });
    if (!added.length && !moved.length && !rebuilt.length && !removed && !regrouped) {
      refreshMeta();
      return { added: 0, removed: 0, updated: 0 };
    }

    share.items = Object.keys(entries).map(function (k) { return entries[k].it; });
    share.items.sort(function (a, b) { return (a.n || 0) - (b.n || 0); });
    groups.forEach(function (g) { g.entries.sort(byN); });
    dropEmptyGroups();
    var relabelAll = false;
    var w = calcPadW();
    if (w !== padW) { padW = w; relabelAll = true; }
    sortGroups();
    (relabelAll ? Object.keys(entries).map(function (k) { return entries[k]; }) : moved).forEach(relabel);
    rebuilt.forEach(rebuildEntry);
    reorderDom();            // 붙어 있는 카드를 entries 순서로(새 항목을 끼우기 전에 — 끼울 자리 계산이 이 순서를 믿는다)
    added.forEach(mountCell);
    refreshMeta();
    restoreAnchor(anchor);
    return { added: added.length, removed: removed, updated: rebuilt.length };
  }

  /** 항목 하나를 화면·목록에서 뺀다(실시간 공유에서 보낸 사람이 지우거나 범위 밖으로 옮김) */
  function removeEntry(e) {
    if (e.cell && e.cell.parentNode) e.cell.parentNode.removeChild(e.cell);
    var a = e.g.entries, i = a.indexOf(e);
    if (i >= 0) a.splice(i, 1);
    delete entries[e.key];
    delete picked[e.key];
    if (anchorKey === e.key) anchorKey = null;
    if (pendingScroll === e.key) pendingScroll = null;
  }

  /** 분류가 바뀐 항목 — 다른 묶음 목록으로 옮긴다(카드 위치는 reorderDom이 맞춤) */
  function moveEntry(e, label) {
    var a = e.g.entries, i = a.indexOf(e);
    if (i >= 0) a.splice(i, 1);
    var g = groupFor(label);
    g.entries.push(e);
    e.g = g;
  }

  /** 항목이 하나도 안 남은 분류 묶음 제거 */
  function dropEmptyGroups() {
    groups = groups.filter(function (g) {
      if (g.entries.length) return true;
      if (g.sec.parentNode) g.sec.parentNode.removeChild(g.sec);
      delete groupMap[g.label];
      return false;
    });
  }

  /** 메모 등이 바뀐 항목 — 카드를 새로 만들어 같은 자리에 바꿔 끼운다(고른 항목이면 상세도) */
  function rebuildEntry(e) {
    var oc = e.cell;
    e.fnEl = e.nmEl = e.dmEl = null;
    if (oc) {
      var nc = buildCell(e);
      if (oc.parentNode) oc.parentNode.replaceChild(nc, oc);
    }
    if (e.key === selKey) renderPanel();
  }

  /** 붙어 있는 카드 순서를 묶음별 entries 순서에 맞춘다 — 제자리인 카드는 건드리지 않는다(대부분 0건) */
  function reorderDom() {
    groups.forEach(function (g) {
      var prev = null;
      g.entries.forEach(function (e) {
        if (!e.cell) return;
        var want = prev ? prev.nextSibling : g.grid.firstChild;
        if (want !== e.cell) g.grid.insertBefore(e.cell, want);
        prev = e.cell;
      });
    });
  }

  /** 지금 보고 있는 요소(화면 위쪽 1/3 지점)와 그 위치 */
  function captureAnchor() {
    if (window.scrollY < 2) return null;   // 맨 위는 그대로
    var x = Math.round(Math.min(window.innerWidth, document.documentElement.clientWidth || window.innerWidth) / 3);
    var y = Math.round(window.innerHeight / 3);
    var node = document.elementFromPoint ? document.elementFromPoint(x, y) : null;
    var a = node && node.closest ? node.closest('.card, .ghead') : null;
    if (!a || !app.contains(a)) return null;
    return { el: a, top: a.getBoundingClientRect().top };
  }

  /** 끼워 넣은 뒤 기준 요소가 밀린 만큼 되돌린다(브라우저 자체 스크롤 고정이 이미 맞췄으면 차이 0).
   *  사진 높이가 한두 프레임 뒤 정해지기도 해서 잠깐(ANCHOR_HOLD_MS) 매 프레임 다시 맞춘다.
   *  사용자가 스크롤·터치·키를 쓰면 바로 그만둔다. */
  var ANCHOR_HOLD_MS = 1500;
  var anchorHold = null;   // {el, top, until}
  function restoreAnchor(an) {
    if (!an || !an.el.isConnected) return;
    var dy = an.el.getBoundingClientRect().top - an.top;
    if (Math.abs(dy) >= 1) window.scrollBy(0, dy);
    var first = !anchorHold;
    anchorHold = { el: an.el, top: an.top, until: Date.now() + ANCHOR_HOLD_MS };
    if (first) requestAnimationFrame(holdAnchorFrame);
  }
  function holdAnchorFrame() {
    var h = anchorHold;
    if (!h) return;
    if (Date.now() > h.until || !h.el.isConnected) { anchorHold = null; return; }
    var dy = h.el.getBoundingClientRect().top - h.top;
    if (Math.abs(dy) >= 1) window.scrollBy(0, dy);
    requestAnimationFrame(holdAnchorFrame);
  }
  function dropAnchorHold() { anchorHold = null; }
  ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function (t) {
    window.addEventListener(t, dropAnchorHold, { passive: true, capture: true });
  });

  /** 분류 머리말 — 앱처럼 ● 이름 · 개수 (+ 다운로드 허용이면 묶음 선택) */
  function buildGroupHead(g) {
    var h = el('h2', 'ghead');
    var dot = el('span', 'gdot');
    if (g.label === '미분류') dot.classList.add('uncat');
    h.appendChild(dot);
    h.appendChild(el('span', 'gname', g.label));
    h.appendChild(el('span', 'gcnt', '· ' + g.entries.length));
    return h;
  }

  /* ── 상세 패널(앱 오른쪽 상세처럼) — 고른 항목 크게 + 번호·날짜 + 원본 받기 + 메모 전문 + 출처 ── */

  var selIndexHint = 0;   // 고른 항목이 빠질 때 옆 항목을 고르려고 기억해 두는 자리

  function rememberSelIndex() {
    if (!share || !share.order) return;
    for (var i = 0; i < share.order.length; i++) if (share.order[i]._k === selKey) { selIndexHint = i; return; }
  }

  /** opts.open: 좁은 화면이면 전체 화면 상세로 · opts.scroll: 카드가 보이게 스크롤 */
  function selectItem(key, opts) {
    opts = opts || {};
    var e = entries[key];
    if (!e) return;
    if (selKey && entries[selKey] && entries[selKey].cell) entries[selKey].cell.classList.remove('cur');
    selKey = key;
    rememberSelIndex();
    if (e.cell) e.cell.classList.add('cur');
    renderPanel();
    if (opts.open && narrow()) openSheet();
    if (opts.scroll) {
      if (e.cell) e.cell.scrollIntoView({ block: 'nearest' });
      else pendingScroll = key;
    }
  }

  function openSheet() {
    if (!panelEl) return;
    panelEl.classList.add('open');
    panelEl.scrollTop = 0;
    document.body.style.overflow = 'hidden';
  }

  function closeSheet() {
    if (!panelEl) return;
    panelEl.classList.remove('open');
    if (!lb.classList.contains('open')) document.body.style.overflow = '';
    var e = selKey && entries[selKey];
    if (e && e.cell) e.cell.scrollIntoView({ block: 'nearest' });
  }

  /** 화면 순서로 앞뒤 항목 고르기(d = -1 / +1) */
  function stepSel(d) {
    var order = share && share.order;
    if (!order || !order.length) return;
    var i = -1;
    for (var j = 0; j < order.length; j++) if (order[j]._k === selKey) { i = j; break; }
    var t = i < 0 ? 0 : Math.max(0, Math.min(order.length - 1, i + d));
    if (t === i) return;
    selectItem(order[t]._k, { scroll: !narrow() });
    if (panelEl && panelEl.classList.contains('open')) panelEl.scrollTop = 0;
  }

  function selPosText() {
    var order = (share && share.order) || [];
    for (var j = 0; j < order.length; j++) if (order[j]._k === selKey) return (j + 1) + ' / ' + order.length;
    return '';
  }

  function updatePanelPos() {
    var p = panelEl && panelEl.querySelector('.ppos');
    if (p) p.textContent = selPosText();
  }

  /** 카드 아래 이름 — 앱처럼 메모 첫 줄(메모를 보여 주는 공유일 때), 없으면 파일 이름 */
  function cardName(it) {
    var m = (share.showMemo || it.kind === 'text') && typeof it.memo === 'string' ? it.memo.trim() : '';
    if (m) return m.split(/\r?\n/)[0];
    return displayName(it);
  }

  /** '1086 × 1448 · PNG' */
  function dimsText(it) {
    var parts = [];
    if (it.width && it.height) parts.push(it.width + ' × ' + it.height);
    var f = (it.mime || '').split('/')[1] || '';
    if (f) parts.push(f.toUpperCase().replace('JPEG', 'JPG').slice(0, 5));
    return parts.join(' · ');
  }

  function extOf(it) {
    var m = /\.([A-Za-z0-9]{1,6})$/.exec(displayName(it));
    return (m ? m[1] : (it.mime || '').split('/')[1] || 'FILE').toUpperCase().slice(0, 6);
  }

  function renderPanel() {
    if (!panelEl) return;
    var e = selKey ? entries[selKey] : null;
    clear(panelEl);

    // 좁은 화면 전용 위 막대: 닫기 · ‹ 위치 ›
    var nav = el('div', 'pnav');
    var close = el('button', 'btn small', '✕ 닫기');
    close.type = 'button';
    close.onclick = closeSheet;
    var prev = el('button', 'btn small', '‹');
    prev.type = 'button';
    prev.setAttribute('aria-label', '이전');
    prev.onclick = function () { stepSel(-1); };
    var next = el('button', 'btn small', '›');
    next.type = 'button';
    next.setAttribute('aria-label', '다음');
    next.onclick = function () { stepSel(1); };
    nav.appendChild(close);
    nav.appendChild(el('span', 'sp'));
    nav.appendChild(prev);
    nav.appendChild(el('span', 'ppos', selPosText()));
    nav.appendChild(next);
    panelEl.appendChild(nav);
    var pm = el('div', 'pmulti');
    pm.hidden = pickCount() < 2;
    pm.textContent = pickCount() + '개 선택됨' + (share.allowDownload ? ' — 아래 "선택 ZIP"으로 한 번에 받기' : '');
    panelEl.appendChild(pm);

    if (!e) {
      panelEl.appendChild(el('div', 'pempty', '항목을 누르면 여기에 크게 보입니다'));
      return;
    }
    var it = e.it;
    var hasFile = it.kind !== 'text' && !!it.fileId;

    if (isImage(it)) {
      var pv = el('div', 'pv');
      var img = el('img');
      img.alt = pad(it.n);
      img.decoding = 'async';
      if (it.width && it.height) { img.width = it.width; img.height = it.height; }
      setImg(img, bigUrl(it.fileId), it.fileId, 1600);
      pv.onclick = function () { openLb(it); };
      pv.appendChild(img);
      attachSwipe(pv);
      panelEl.appendChild(pv);
    } else if (hasFile) {
      var fb = el('div', 'filebox');
      fb.appendChild(el('div', 'fext', extOf(it)));
      fb.appendChild(el('div', 'fname', displayName(it)));
      var fm = [it.mime, fmtSize(it.size)].filter(Boolean).join(' · ');
      if (fm) fb.appendChild(el('div', 'fmeta', fm));
      panelEl.appendChild(fb);
    }

    var hd = el('div', 'phead');
    hd.appendChild(el('span', 'pn', pad(it.n)));
    if (it.createdAt) hd.appendChild(el('span', 'pdate', it.createdAt));
    var dm = isImage(it) ? dimsText(it) : '';
    if (dm) hd.appendChild(el('span', 'pdim', dm));
    panelEl.appendChild(hd);

    var acts = el('div', 'links');
    if (share.allowDownload && hasFile) {
      appendDownload(acts, it, isImage(it) ? '원본 받기' : '파일 받기', 'btn primary small');
      if (it.size) acts.appendChild(el('span', 'src', fmtSize(it.size)));
    }
    if (isImage(it)) {
      var big = el('button', 'btn small', '크게 보기');
      big.type = 'button';
      big.onclick = function () { openLb(it); };
      acts.appendChild(big);
    }
    if (acts.firstChild) panelEl.appendChild(acts);

    if (share.showMemo || it.kind === 'text') {
      var ml = el('div', 'plbl');
      ml.appendChild(document.createTextNode('📝  메모'));
      if (it.memo) {
        var cp = el('button', 'btn small', '메모 복사');
        cp.type = 'button';
        cp.onclick = function () { copyText(it.memo); };
        ml.appendChild(cp);
      }
      panelEl.appendChild(ml);
      panelEl.appendChild(el('div', it.memo ? 'memo' : 'memo empty', it.memo || '메모 없음'));   // 전문 — 잘라내지 않음
    }
    if (isHttp(it.sourceUrl)) {
      var sl = el('div', 'plbl', '🔗  출처');
      panelEl.appendChild(sl);
      var a = el('a', 'src', it.sourceUrl);
      a.href = it.sourceUrl;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      var row = el('div', 'links');
      row.appendChild(a);
      panelEl.appendChild(row);
    }
    panelEl.appendChild(el('div', 'pmeta', '📂  ' + catLabel(it)));
  }

  /** 상세 사진 좌우 스와이프 = 앞뒤 항목(좁은 화면) */
  function attachSwipe(node) {
    var sx = 0, sy = 0, on = false;
    node.addEventListener('touchstart', function (ev) {
      if (ev.touches.length !== 1) { on = false; return; }
      on = true; sx = ev.touches[0].clientX; sy = ev.touches[0].clientY;
    }, { passive: true });
    node.addEventListener('touchend', function (ev) {
      if (!on) return;
      on = false;
      var t = ev.changedTouches[0];
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) stepSel(dx < 0 ? 1 : -1);
    }, { passive: true });
  }

  // 키보드(앱과 같게): ←/→/↑/↓ 옮기기(Shift = 범위로 고르기) · Home/End · Ctrl+A 전체 · Esc 해제(전체 화면 상세면 닫기) · Enter 크게 보기.
  // 라이트박스가 열려 있으면 라이트박스가 처리한다.
  document.addEventListener('keydown', function (ev) {
    if (lb.classList.contains('open') || !share || !panelEl) return;
    var t = ev.target;
    if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    var k = null;
    if (ev.key === 'ArrowRight') k = orderNeighbor(1);
    else if (ev.key === 'ArrowLeft') k = orderNeighbor(-1);
    else if (ev.key === 'ArrowDown') k = narrow() ? orderNeighbor(1) : (verticalNeighbor(1) || orderNeighbor(1));
    else if (ev.key === 'ArrowUp') k = narrow() ? orderNeighbor(-1) : (verticalNeighbor(-1) || orderNeighbor(-1));
    else if (ev.key === 'Home') k = share.order.length ? share.order[0]._k : null;
    else if (ev.key === 'End') k = share.order.length ? share.order[share.order.length - 1]._k : null;
    if (k) {
      ev.preventDefault();
      if (ev.shiftKey) selectRange(anchorKey && entries[anchorKey] ? anchorKey : (selKey || k), k, ev.ctrlKey || ev.metaKey);
      else pickOnly(k);
      selectItem(k, { scroll: true });
      if (panelEl.classList.contains('open')) panelEl.scrollTop = 0;
      return;
    }
    if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'a' || ev.key === 'A')) {
      ev.preventDefault();
      selectAll();
    } else if (ev.key === 'Escape') {
      if (panelEl.classList.contains('open')) closeSheet();
      else if (pickCount()) clearPicks();
    } else if (ev.key === 'Enter' && selKey && entries[selKey] && isImage(entries[selKey].it) && !(t && t.tagName === 'BUTTON')) {
      ev.preventDefault();
      openLb(entries[selKey].it);
    }
  });

  /* ── 업로드 중 막대 ── */

  function buildUpbar() {
    var b = el('div', 'upbar');
    b.id = 'upbar';
    b.setAttribute('role', 'status');
    b.appendChild(el('div', 'uptext'));
    var bar = el('div', 'bar');
    bar.appendChild(el('i'));
    b.appendChild(bar);
    updateUpbar(b);
    return b;
  }

  function updateUpbar(b) {
    b = b || upbar;
    if (!b || !live) return;
    var done = live.uploaded, total = live.total;
    var txt;
    if (live.stalled) {
      txt = '업로드가 멈춘 것 같습니다 — 지금까지 올라온 사진만 볼 수 있어요' + (total ? ' (' + done + ' / ' + total + ')' : '');
    } else {
      txt = '사진 올라오는 중… ' + (total ? done + ' / ' + total : done + '장') + ' (자동으로 추가됩니다)';
    }
    var t = b.querySelector('.uptext');
    if (t.textContent !== txt) t.textContent = txt;
    b.classList.toggle('stalled', !!live.stalled);
    var fill = b.querySelector('.bar i');
    var ratio = total ? Math.max(0, Math.min(1, done / total)) : 0;
    fill.style.width = Math.round(ratio * 100) + '%';
    b.querySelector('.bar').style.display = total ? '' : 'none';
  }

  /** 앱 안 브라우저(카카오톡 등)에서 외부 브라우저로 여는 주소. 없으면 null(메뉴 안내만). */
  function externalOpenUrl() {
    var href = location.href;
    if (IS_KAKAO) return 'kakaotalk://web/openExternal?url=' + encodeURIComponent(href);
    if (IS_ANDROID && /^https:\/\//i.test(href)) {
      return 'intent://' + href.replace(/^https:\/\//i, '') + '#Intent;scheme=https;package=com.android.chrome;end';
    }
    return null;
  }

  function sumSize(list) {
    var t = 0;
    list.forEach(function (it) { if (it.fileId && it.kind !== 'text' && it.size > 0) t += it.size; });
    return t;
  }

  /** ZIP 한 개 상한 — 넘으면 여러 개로 나눠 하나씩 만들고 저장(휴대폰 브라우저 메모리 부족으로 탭이 죽지 않게) */
  function zipParts(withFile) {
    var parts = [[]], acc = 0;
    withFile.forEach(function (it) {
      var sz = it.size > 0 ? it.size : 0;
      var cur = parts[parts.length - 1];
      if (cur.length && acc + sz > ZIP_PART_MAX) { parts.push([]); acc = 0; cur = parts[parts.length - 1]; }
      cur.push(it);
      acc += sz;
    });
    return parts;
  }

  function zipAllLabel(order) {
    // 업로드 중에는 '지금까지 올라온 것만' 묶인다는 걸 분명히
    if (live) return '지금까지 올라온 ' + order.length + '장 ZIP';
    var total = sumSize(order);
    if (!total) return '전체 ZIP';
    var withFile = order.filter(function (it) { return it.fileId && it.kind !== 'text'; });
    var n = zipParts(withFile).length;
    return '전체 ZIP (' + fmtSize(total) + (n > 1 ? ' · ' + n + '개로 나눔' : '') + ')';
  }

  /** 앱 안 브라우저(카카오톡 등) 안내 — 사진 저장·ZIP이 안 될 수 있어 다른 브라우저로 열기를 권한다. 아니면 null */
  function buildInappHint() {
    if (!IS_INAPP) return null;
    var hint = el('div', 'hint');
    hint.id = 'inappHint';
    var ext = externalOpenUrl();
    hint.appendChild(document.createTextNode(
      '앱 안 브라우저에서는 사진 저장·묶음(ZIP) 다운로드가 안 될 수 있습니다. ' +
      (ext ? '아래 버튼으로 다른 브라우저에서 열어 주세요.' : '메뉴의 "다른 브라우저로 열기"(또는 "Safari로 열기")를 이용해 주세요.')));
    if (ext) {
      var ob = el('a', 'btn primary', '다른 브라우저로 열기');
      ob.id = 'openExternal';
      ob.href = ext;
      hint.appendChild(el('br'));
      hint.appendChild(ob);
    }
    return hint;
  }

  /** 위 막대 오른쪽 — 전체 ZIP(+ 넓은 화면은 여러 장 고르는 법 한 줄) */
  function buildDlBar() {
    var bar = el('div', 'dlbar');
    if (!IS_MOBILE) bar.appendChild(el('span', 'tip', 'Ctrl·Shift+클릭이나 빈 곳을 끌어 여러 장 고르기'));
    var allBtn = el('button', 'btn primary', '전체 ZIP');
    allBtn.type = 'button';
    allBtn.id = 'zipAll';
    allBtn.onclick = function () { makeZip(share.order.slice(), true); };
    bar.appendChild(allBtn);
    return bar;
  }

  /** 아래에 떠 있는 것들 — 여러 장 골랐을 때 막대(N개 선택 · 선택 ZIP · 전체 선택 · 선택 해제)와 받기 진행 알림 */
  function buildFloating() {
    var frag = document.createDocumentFragment();
    var sb = el('div', 'selbar');
    sb.id = 'selbar';
    sb.hidden = true;
    sb.appendChild(el('span', 'cnt'));
    if (share.allowDownload) {
      var z = el('button', 'btn primary small', '선택 ZIP');
      z.type = 'button';
      z.id = 'zipSel';
      z.onclick = function () { makeZip(share.order.filter(function (it) { return picked[it._k]; }), false); };
      sb.appendChild(z);
    }
    var a = el('button', 'btn small', '전체 선택');
    a.type = 'button';
    a.onclick = selectAll;
    sb.appendChild(a);
    var c = el('button', 'btn small', '선택 해제');
    c.type = 'button';
    c.onclick = clearPicks;
    sb.appendChild(c);
    frag.appendChild(sb);
    if (share.allowDownload) {
      var st = el('div', 'dlstatus');
      st.id = 'dlstatus';
      frag.appendChild(st);
    }
    return frag;
  }

  /** 선택(파란 테두리)·선택 막대·선택 ZIP 버튼·상세 위 'N개 선택' 줄을 picked에 맞춘다 */
  function syncPicks() {
    var count = 0;
    Object.keys(entries).forEach(function (k) {
      var e = entries[k];
      var on = !!picked[k];
      if (on) count++;
      if (e.cell) e.cell.classList.toggle('sel', on);
    });
    var sb = document.getElementById('selbar');
    if (sb) {
      // 넓은 화면은 2장 이상일 때만(한 장은 오른쪽 상세에서 받으면 됨), 폰은 길게 눌러 고르기 시작하면 1장부터
      sb.hidden = !(count >= 2 || (count >= 1 && lastPointer === 'touch'));
      var c = sb.querySelector('.cnt');
      if (c) c.textContent = count + '개 선택';
    }
    var sel = document.getElementById('zipSel');
    if (sel) sel.disabled = busy || !count;
    var pm = panelEl && panelEl.querySelector('.pmulti');
    if (pm) {
      pm.hidden = count < 2;
      pm.textContent = count + '개 선택됨' + (share.allowDownload ? ' — 아래 "선택 ZIP"으로 한 번에 받기' : '');
    }
  }

  /** 그 항목을 고르고 카드가 보이게 */
  function scrollToItem(it) {
    var k = it._k || itemKey(it);
    if (entries[k]) selectItem(k, { scroll: true });
  }

  /* ── 고르기 — Stash 앱처럼: 클릭 = 그것만 · Ctrl(⌘)+클릭 = 넣고 빼기 · Shift+클릭 = 이어서 범위 · 빈 곳 끌기 = 박스 선택 ·
   *    Ctrl+A = 전체 · Esc = 해제 · ←/→/↑/↓ = 옮기기(Shift = 범위). 폰은 길게 눌러 고르기 시작, 그다음 누르면 넣고 빼기.
   *    picked = 고른 것(ZIP 대상), selKey = 오른쪽 상세에 보이는 것, anchorKey = Shift 범위의 시작 ── */

  var anchorKey = null;
  var lastPointer = 'mouse';
  var suppressClick = false;
  document.addEventListener('pointerdown', function (ev) { lastPointer = ev.pointerType || 'mouse'; }, true);

  function pickCount() { return Object.keys(picked).length; }

  function togglePick(key) {
    if (picked[key]) delete picked[key]; else picked[key] = true;
    anchorKey = key;
    syncPicks();
  }

  function pickOnly(key) {
    picked = {};
    picked[key] = true;
    anchorKey = key;
    syncPicks();
  }

  function selectRange(fromKey, toKey, add) {
    var order = share.order, ia = -1, ib = -1;
    for (var i = 0; i < order.length; i++) {
      if (order[i]._k === fromKey) ia = i;
      if (order[i]._k === toKey) ib = i;
    }
    if (ib < 0) return;
    if (ia < 0) ia = ib;
    if (!add) picked = {};
    for (var j = Math.min(ia, ib); j <= Math.max(ia, ib); j++) picked[order[j]._k] = true;
    syncPicks();
  }

  function selectAll() {
    picked = {};
    share.order.forEach(function (it) { picked[it._k] = true; });
    syncPicks();
  }

  function clearPicks() {
    picked = {};
    syncPicks();
  }

  function onCardClick(e, ev) {
    if (suppressClick) { suppressClick = false; return; }   // 길게 누른 직후 따라오는 클릭
    if (lastPointer === 'touch') {
      // 폰: 그냥 누르면 상세만 연다(고르지 않음) — 고르기는 길게 눌러 시작, 고르는 중엔 누르면 넣고 빼기
      if (pickCount()) {
        togglePick(e.key);
        selectItem(e.key, {});
      } else {
        selectItem(e.key, { open: true });
      }
      return;
    }
    var multi = ev.ctrlKey || ev.metaKey;
    if (ev.shiftKey) {
      selectRange(anchorKey && entries[anchorKey] ? anchorKey : (selKey || e.key), e.key, multi);
      selectItem(e.key, {});
      return;
    }
    if (multi) {
      togglePick(e.key);
      selectItem(e.key, {});
      return;
    }
    pickOnly(e.key);
    selectItem(e.key, { open: true });
  }

  /** 폰: 길게 누르면 고르기 시작(진동) — 브라우저 길게 누르기 메뉴 대신 */
  function attachLongPress(card, e) {
    var t = null, sx = 0, sy = 0;
    card.addEventListener('touchstart', function (ev) {
      if (ev.touches.length !== 1) return;
      sx = ev.touches[0].clientX;
      sy = ev.touches[0].clientY;
      clearTimeout(t);
      t = setTimeout(function () {
        t = null;
        suppressClick = true;
        setTimeout(function () { suppressClick = false; }, 700);
        lastPointer = 'touch';
        togglePick(e.key);
        selectItem(e.key, {});
        try { if (navigator.vibrate) navigator.vibrate(12); } catch (x) { /* 무시 */ }
      }, 450);
    }, { passive: true });
    card.addEventListener('touchmove', function (ev) {
      if (t && (Math.abs(ev.touches[0].clientX - sx) > 10 || Math.abs(ev.touches[0].clientY - sy) > 10)) { clearTimeout(t); t = null; }
    }, { passive: true });
    card.addEventListener('touchend', function () { clearTimeout(t); t = null; }, { passive: true });
    card.addEventListener('touchcancel', function () { clearTimeout(t); t = null; }, { passive: true });
    card.addEventListener('contextmenu', function (ev) { if (lastPointer === 'touch') ev.preventDefault(); });
  }

  /** 빈 곳을 끌어 박스 선택(마우스) — 박스에 걸친 카드를 고른다. Ctrl·Shift면 이미 고른 것에 더한다.
   *  가장자리로 끌면 화면이 따라 스크롤된다. 그냥 빈 곳 클릭 = 선택 해제(앱과 같음). */
  function initRubber(gal) {
    gal.addEventListener('mousedown', function (ev) {
      if (ev.button !== 0 || (ev.target.closest && ev.target.closest('.card'))) return;
      ev.preventDefault();
      var add = ev.ctrlKey || ev.metaKey || ev.shiftKey;
      var base = {};
      if (add) Object.keys(picked).forEach(function (k) { base[k] = true; });
      else clearPicks();
      var sx = ev.pageX, sy = ev.pageY, cx = ev.clientX, cy = ev.clientY;
      var box = null, raf = 0, scrollRaf = 0;
      var rects = null;   // 카드 위치(문서 기준) — 처음 한 번 잰다(스크롤해도 문서 기준이라 그대로)
      var update = function () {
        raf = 0;
        var px = cx + window.scrollX, py = cy + window.scrollY;
        var x1 = Math.min(sx, px), y1 = Math.min(sy, py), x2 = Math.max(sx, px), y2 = Math.max(sy, py);
        if (!box) {
          if (Math.abs(px - sx) + Math.abs(py - sy) < 5) return;
          box = el('div', 'rubber');
          document.body.appendChild(box);
          rects = Object.keys(entries).map(function (k) {
            var c = entries[k].cell;
            if (!c) return null;
            var r = c.getBoundingClientRect();
            return { k: k, l: r.left + window.scrollX, t: r.top + window.scrollY, r: r.right + window.scrollX, b: r.bottom + window.scrollY };
          }).filter(Boolean);
        }
        box.style.left = x1 + 'px';
        box.style.top = y1 + 'px';
        box.style.width = (x2 - x1) + 'px';
        box.style.height = (y2 - y1) + 'px';
        var next = {};
        Object.keys(base).forEach(function (k) { next[k] = true; });
        rects.forEach(function (q) { if (q.l < x2 && q.r > x1 && q.t < y2 && q.b > y1) next[q.k] = true; });
        picked = next;
        syncPicks();
      };
      var edgeScroll = function () {
        scrollRaf = 0;
        if (!box) return;
        var dy = cy < 40 ? -14 : (cy > window.innerHeight - 40 ? 14 : 0);
        if (dy) {
          window.scrollBy(0, dy);
          if (!raf) raf = requestAnimationFrame(update);
          scrollRaf = requestAnimationFrame(edgeScroll);
        }
      };
      var move = function (e2) {
        cx = e2.clientX;
        cy = e2.clientY;
        if (!raf) raf = requestAnimationFrame(update);
        if (!scrollRaf) scrollRaf = requestAnimationFrame(edgeScroll);
      };
      var up = function () {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        if (raf) cancelAnimationFrame(raf);
        if (scrollRaf) cancelAnimationFrame(scrollRaf);
        if (box) {
          box.remove();
          var last = null;   // 고른 것 중 화면 순서상 마지막을 상세로
          share.order.forEach(function (it) { if (picked[it._k]) last = it._k; });
          if (last) selectItem(last, {});
        }
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
  }

  /** 위·아래 이웃 카드(마소너리라 번호 순이 아니라 화면 위치로) */
  function verticalNeighbor(dir) {
    var cur = selKey && entries[selKey];
    if (!cur || !cur.cell) return null;
    var r = cur.cell.getBoundingClientRect();
    var mid = (r.left + r.right) / 2;
    var best = null, bestD = Infinity;
    Object.keys(entries).forEach(function (k) {
      var c = entries[k].cell;
      if (!c || k === selKey) return;
      var q = c.getBoundingClientRect();
      if (dir > 0 ? q.top < r.bottom - 2 : q.bottom > r.top + 2) return;
      var dx = q.left > mid ? q.left - mid : (q.right < mid ? mid - q.right : 0);
      var dy = dir > 0 ? q.top - r.bottom : r.top - q.bottom;
      var d = dy + dx * 3;
      if (d < bestD) { bestD = d; best = k; }
    });
    return best;
  }

  /** 화면 순서로 d칸 옆 항목 키 */
  function orderNeighbor(d) {
    var order = share.order, i = -1;
    if (!order.length) return null;
    for (var j = 0; j < order.length; j++) if (order[j]._k === selKey) { i = j; break; }
    var t = i < 0 ? 0 : Math.max(0, Math.min(order.length - 1, i + d));
    return order[t]._k;
  }

  /** 카드 — 앱 갤러리 카드처럼: 사진(비율대로) + 번호 + 아래 이름·크기. 누르면 상세, 두 번 누르면 크게 */
  function buildCell(e) {
    var it = e.it;
    var card = el('div', 'card');
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', pad(it.n) + '번 ' + cardName(it));
    var ib = el('div', 'ib');
    if (isImage(it)) {
      var img = el('img');
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      setImg(img, thumbUrl(it.fileId), it.fileId, 400);
      ib.appendChild(img);
    } else if (it.kind === 'text') {
      ib.className = 'ib txt';
      ib.appendChild(el('div', 'tlbl', 'TEXT'));
      ib.appendChild(el('div', 'tbody', (it.memo || '').slice(0, 400) || '(메모)'));
    } else {
      ib.className = 'ib file';
      ib.appendChild(el('div', 'fext', extOf(it)));
      e.fnEl = el('div', 'fname', displayName(it));
      ib.appendChild(e.fnEl);
      if (it.size) ib.appendChild(el('div', 'fsize', fmtSize(it.size)));
    }
    e.numEl = el('span', 'num', pad(it.n));
    ib.appendChild(e.numEl);

    card.appendChild(ib);

    if (isImage(it)) {
      var lbl = el('div', 'lbl');
      e.nmEl = el('div', 'nm', cardName(it));
      e.dmEl = el('div', 'dm', dimsText(it));
      lbl.appendChild(e.nmEl);
      lbl.appendChild(e.dmEl);
      card.appendChild(lbl);
    }
    if (picked[e.key]) card.classList.add('sel');
    if (selKey === e.key) card.classList.add('cur');
    e.cell = card;
    e.ib = ib;
    sizeCard(e);

    card.addEventListener('mousedown', function (ev) { if (ev.shiftKey || ev.ctrlKey || ev.metaKey) ev.preventDefault(); });   // 글자 선택 막기
    card.onclick = function (ev) { onCardClick(e, ev); };
    card.ondblclick = function () { if (isImage(e.it)) openLb(e.it); };
    attachLongPress(card, e);
    return card;
  }

  /** 표시용 파일명: "001_abc.png" → "abc.png" */
  function displayName(it) {
    var nm = it.name || '';
    return nm.replace(/^\d{3,4}_/, '') || '파일';
  }

  /* ── 업로드 중 공유(uploading): 4초마다 m.json 다시 읽어 이어 붙이기 ──
   * 보낸 사람 앱이 사진을 올리는 동안에도 링크가 바로 열린다. 올라온 만큼 보여 주고, 새로 온 항목은
   * 화면을 다시 그리지 않고 끼워 넣는다(mergeShare). ready가 되면 번호를 맞추고(당겨질 수 있음) 멈춘다.
   * 2분 동안 변화가 없으면 "멈춘 것 같습니다" + 30초 간격. 비밀번호 공유는 기억해 둔 키(dk)로 다시 푼다(다시 묻지 않음).
   */
  var POLL_MS = 4000;
  var POLL_STALLED_MS = 30000;
  var STALL_AFTER_MS = 2 * 60 * 1000;
  var STALE_UPDATED_MS = 10 * 60 * 1000;   // 처음 열 때 서버 updatedAt이 이만큼 지났으면 바로 '멈춤'으로
  var live = null;          // {total, uploaded, sig, lastChange, stalled, dk}
  var pollTimer = null;

  function startLive(env, dk, itemCount) {
    var upd = Date.parse(env.updatedAt || '');
    live = {
      total: typeof env.total === 'number' && env.total > 0 ? env.total : null,
      uploaded: typeof env.uploaded === 'number' ? env.uploaded : itemCount,
      sig: '', lastChange: Date.now(), stalled: false, dk: dk || null
    };
    live.sig = live.uploaded + ':' + itemCount;
    if (!isNaN(upd) && Date.now() - upd > STALE_UPDATED_MS) live.stalled = true;
    schedulePoll();
  }

  function stopLive() {
    clearTimeout(pollTimer);
    pollTimer = null;
    live = null;
  }

  function schedulePoll(ms) {
    clearTimeout(pollTimer);
    if (!live) return;
    pollTimer = setTimeout(poll, ms != null ? ms : (live.stalled ? POLL_STALLED_MS : POLL_MS));
  }

  function poll() {
    if (!live) return;
    // 탭이 안 보이면 쉰다 — 다시 보이면 바로 확인(visibilitychange)
    if (document.hidden) { schedulePoll(); return; }
    var myGen = gen, mid = MID;
    fetchManifest(mid, true).then(function (r) {
      if (myGen !== gen || !live) return;
      if (r.kind === 'gone') { stopLive(); stateScreen('만료되었거나 삭제된 링크입니다', '필요하면 보내준 사람에게 다시 요청하세요.'); return; }
      var env = r.env;
      if (r.kind !== 'ok' || !env || typeof env !== 'object' || env.v !== 2) { noChange(); return; }   // 일시 문제 — 다음에 다시
      if (env.status === 'gone') { stopLive(); stateScreen('만료되었거나 삭제된 링크입니다', '필요하면 보내준 사람에게 다시 요청하세요.'); return; }
      if (isPast(env.expiresAt)) { stopLive(); expiredScreen(); return; }
      if (env.status !== 'uploading' && env.status !== 'ready') { noChange(); return; }
      var dataP;
      if (env.enc) {
        if (!live.dk) {
          // 보내는 중에 비밀번호가 새로 걸림(평문으로 보던 중) → 처음부터(비밀번호 화면)
          stopLive();
          openV2(false);
          return;
        }
        if (!encOk(env)) { noChange(); return; }
        dataP = StashCrypto.decrypt(env, live.dk);
      } else {
        dataP = Promise.resolve(env.data);
      }
      dataP.then(function (data) {
        if (myGen !== gen || !live) return;
        applyLive(env, data);
      }, function (e) {
        if (myGen !== gen || !live) return;
        if (e && e.code === 'mac') {
          // 보내는 중에 비밀번호가 바뀜 → 처음부터(비밀번호 다시 묻기)
          stopLive();
          storeDel('stash_dk_' + mid);
          openV2(false);
          return;
        }
        noChange();
      });
    }, function () {
      if (myGen === gen && live) noChange();
    });
  }

  function noChange() {
    if (!live) return;
    if (!live.stalled && Date.now() - live.lastChange > STALL_AFTER_MS) { live.stalled = true; updateUpbar(); }
    schedulePoll();
  }

  function applyLive(env, data) {
    if (!data || typeof data !== 'object' || !Array.isArray(data.items)) { noChange(); return; }
    // 처음 그리기가 아직 덜 끝났으면(항목 많을 때 프레임 나눠 그림) 조금 뒤 다시
    if (share && !document.body.hasAttribute('data-rendered')) {
      var myGen = gen;
      setTimeout(function () { if (myGen === gen && live) applyLive(env, data); }, 200);
      return;
    }
    var ready = env.status === 'ready';
    var count = data.items.length;
    if (!ready) {
      live.total = typeof env.total === 'number' && env.total > 0 ? env.total : live.total;
      live.uploaded = typeof env.uploaded === 'number' ? env.uploaded : count;
      var sig = live.uploaded + ':' + count;
      if (sig !== live.sig) { live.sig = sig; live.lastChange = Date.now(); live.stalled = false; }
      else if (Date.now() - live.lastChange > STALL_AFTER_MS) live.stalled = true;
    }
    if (!share) {
      // 아직 한 장도 없어 '준비 중' 화면이었음 → 이제 처음 그린다
      // ready면 0장이어도 그린다(render가 '공유된 항목이 없습니다' 처리) — 계속 폴링하지 않게
      if (ready) {
        var dk0 = live.dk;
        stopLive();
        syncOn = !!env.live;
        showShare(data, false);
        if (syncOn) startWatch(env, dk0);   // 실시간 공유 — 이제부터는 바뀔 때만 다시 읽는다
        return;
      }
      if (count) showShare(data, false);
      if (live) schedulePoll();
      return;
    }
    if (ready) {
      var dk1 = live.dk;
      stopLive();                       // zipAllLabel·막대가 ready 기준이 되도록 먼저
      share.live = false;
      syncOn = !!env.live;
      share.sync = syncOn;
      mergeShare(data);
      if (upbar) { var anchor = captureAnchor(); upbar.remove(); upbar = null; restoreAnchor(anchor); }
      ensureLiveBadge();
      toast('사진이 모두 올라왔습니다');
      if (syncOn) startWatch(env, dk1);
      return;
    }
    mergeShare(data);
    updateUpbar();
    schedulePoll();
  }

  /* ── 실시간 공유(ready + 봉투 live): 열어 둔 채로 바뀐 것만 반영 ──
   * 보낸 사람 PC의 Stash가 그 모델·카테고리에 항목을 추가·삭제·이동하거나 메모를 고치면 m.json이 다시 써진다.
   * 20초마다(탭이 보일 때만) Drive 메타데이터(version — 몇백 바이트)만 확인하고, 바뀌었을 때만 m.json을 받아 합친다.
   * 30분 넘게 변화가 없으면 60초 간격. 메타데이터를 못 읽는 환경이면 m.json을 60초마다 직접 받는다.
   * 비밀번호 공유는 처음 입력으로 얻은 키(dk)로 다시 푼다. 보낸 사람이 실시간을 끄면 지금 내용 그대로 멈춘다.
   */
  var WATCH_MS = 20000;
  var WATCH_IDLE_MS = 60000;
  var WATCH_IDLE_AFTER_MS = 30 * 60 * 1000;
  var watch = null;        // {ver, dk, metaOk, lastChange, syncedAt}
  var watchTimer = null;

  function startWatch(env, dk) {
    stopWatch();
    watch = { ver: '', dk: dk || null, metaOk: true, lastChange: Date.now(), syncedAt: (env && env.syncedAt) || null };
    if (share) share.sync = true;
    ensureLiveBadge();
    scheduleWatch();
  }

  function stopWatch() {
    clearTimeout(watchTimer);
    watchTimer = null;
    watch = null;
  }

  function scheduleWatch(ms) {
    clearTimeout(watchTimer);
    if (!watch) return;
    var slow = !watch.metaOk || Date.now() - watch.lastChange > WATCH_IDLE_AFTER_MS;
    watchTimer = setTimeout(watchTick, ms != null ? ms : (slow ? WATCH_IDLE_MS : WATCH_MS));
  }

  /** m.json 메타데이터만 → {ver} | {gone:true} | {retry:true}(일시 오류) | {nometa:true}(이 방법을 못 씀) */
  function fetchMeta(mid) {
    var url = DRIVE_FILES + encodeURIComponent(mid) + '?fields=version%2CmodifiedTime&key=' + encodeURIComponent(DRIVE_API_KEY) + '&_=' + Date.now();
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 15000) : null;
    return fetch(url, { credentials: 'omit', cache: 'no-store', signal: ctl ? ctl.signal : undefined }).then(function (res) {
      if (timer) clearTimeout(timer);
      if (res.ok) {
        return res.json().then(function (j) {
          var v = j && (j.version || j.modifiedTime) ? String(j.version || '') + '|' + String(j.modifiedTime || '') : '';
          return v ? { ver: v } : { nometa: true };
        }, function () { return { nometa: true }; });
      }
      return errInfo(res).then(function (why) {
        if (res.status === 404 || res.status === 410 || (res.status === 403 && GONE_REASONS.test(why))) return { gone: true };
        if (res.status === 429 || res.status >= 500 || RATE_REASONS.test(why)) return { retry: true };
        return { nometa: true };
      });
    }, function () {
      if (timer) clearTimeout(timer);
      return { retry: true };
    });
  }

  function watchTick() {
    if (!watch) return;
    if (document.hidden) { scheduleWatch(); return; }   // 다시 보이면 visibilitychange가 바로 확인
    var myGen = gen, mid = MID;
    var metaP = watch.metaOk ? fetchMeta(mid) : Promise.resolve({ nometa: true });
    metaP.then(function (m) {
      if (myGen !== gen || !watch) return;
      if (m.gone) { stopWatch(); stateScreen('만료되었거나 삭제된 링크입니다', '필요하면 보내준 사람에게 다시 요청하세요.'); return; }
      if (m.retry) { scheduleWatch(); return; }
      if (m.nometa) watch.metaOk = false;
      else if (m.ver === watch.ver) { scheduleWatch(); return; }   // 그대로 — m.json을 받지 않는다
      return fetchManifest(mid, true).then(function (r) {
        if (myGen !== gen || !watch) return;
        if (r.kind === 'gone') { stopWatch(); stateScreen('만료되었거나 삭제된 링크입니다', '필요하면 보내준 사람에게 다시 요청하세요.'); return; }
        var env = r.env;
        if (r.kind !== 'ok' || !env || typeof env !== 'object' || env.v !== 2) { scheduleWatch(); return; }
        if (env.status === 'gone') { stopWatch(); stateScreen('만료되었거나 삭제된 링크입니다', '필요하면 보내준 사람에게 다시 요청하세요.'); return; }
        if (isPast(env.expiresAt)) { stopWatch(); expiredScreen(); return; }
        if (env.status !== 'ready') { scheduleWatch(); return; }
        var dataP;
        if (env.enc) {
          if (!watch.dk) { stopWatch(); openV2(false); return; }   // 보던 중에 비밀번호가 새로 걸림 → 비밀번호 화면
          if (!encOk(env)) { scheduleWatch(); return; }
          dataP = StashCrypto.decrypt(env, watch.dk);
        } else {
          dataP = Promise.resolve(env.data);
        }
        return dataP.then(function (data) {
          if (myGen !== gen || !watch) return;
          if (m.ver) watch.ver = m.ver;
          applyWatch(env, data);
        }, function (e) {
          if (myGen !== gen || !watch) return;
          if (e && e.code === 'mac') {   // 비밀번호가 바뀜 → 처음부터 다시 묻기
            stopWatch();
            storeDel('stash_dk_' + mid);
            openV2(false);
            return;
          }
          scheduleWatch();
        });
      });
    }).catch(function () {
      if (myGen === gen && watch) scheduleWatch();
    });
  }

  function applyWatch(env, data) {
    if (!data || typeof data !== 'object' || !Array.isArray(data.items) || !share) { scheduleWatch(); return; }
    // 처음 그리기가 아직 덜 끝났으면(항목 많을 때 프레임 나눠 그림) 조금 뒤 다시
    if (!document.body.hasAttribute('data-rendered')) {
      var myGen = gen;
      setTimeout(function () { if (myGen === gen && watch) applyWatch(env, data); }, 200);
      return;
    }
    if (isPast(data.expiresAt)) { stopWatch(); expiredScreen(); return; }
    var still = !!env.live;
    if (env.syncedAt) watch.syncedAt = env.syncedAt;
    syncOn = still;
    var res = mergeShare(data);
    share.sync = still;
    ensureLiveBadge();
    if (res && (res.added || res.removed || res.updated)) {
      watch.lastChange = Date.now();
      var parts = [];
      if (res.added) parts.push('새 항목 ' + res.added + '개 추가');
      if (res.removed) parts.push(res.removed + '개 빠짐');
      if (res.updated) parts.push(res.updated + '개 내용 바뀜');
      toast(parts.join(' · '));
    }
    if (!still) { stopWatch(); return; }   // 보낸 사람이 실시간을 끔 — 지금 내용 그대로
    scheduleWatch();
  }

  /** 머리말의 '실시간 공유' 표시 — share.sync일 때만. 마지막 업데이트 시각을 같이 */
  function ensureLiveBadge() {
    if (!share || !headEl) return;
    if (!share.sync) {
      if (liveEl) { liveEl.remove(); liveEl = null; }
      return;
    }
    if (!liveEl) {
      liveEl = el('div', 'livebadge');
      headEl.appendChild(liveEl);
    }
    clear(liveEl);
    liveEl.appendChild(el('i'));
    var at = watch && watch.syncedAt ? fmtStamp(watch.syncedAt) : '';
    liveEl.title = '보낸 사람이 추가·삭제하면 이 화면에 자동으로 반영됩니다';
    liveEl.appendChild(document.createTextNode('실시간 공유'));
    liveEl.appendChild(el('span', 'lx', ' · 새로 추가되는 항목이 자동으로 나타납니다'));   // 좁은 화면에선 숨김
    if (at) liveEl.appendChild(document.createTextNode(' · ' + at + ' 업데이트'));
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    if (live) schedulePoll(0);
    else if (watch) scheduleWatch(0);
    else if (retryTimer && MODE === 'v2' && !share) { clearTimeout(retryTimer); retryTimer = null; openV2(true); }
  });

  /** 검증 수준 → 안내 문구 */
  var LEVEL_TEXT = { hash: '원본 일치(SHA-256) 확인', size: '크기만 확인(해시 정보 없음)', none: '확인 정보 없음(검증 안 됨)' };

  /**
   * 항목별 받기 — 원본 바이트를 받아 크기·SHA-256 확인 후 저장.
   * 저장은 자동 클릭 + 눈에 보이는 '저장하기' 링크(앱 안 브라우저·사용자 동작 만료 대비).
   * 직접 링크(Drive)는 검증 없는 수동 폴백 — 보관된 사본 자체가 원본과 다르면(storedBad) 숨긴다.
   */
  function appendDownload(parent, it, label, cls) {
    var btn = el('button', cls, label);
    btn.type = 'button';
    btn.className += ' dl1';
    var save = el('a', 'src save', '저장하기');
    save.style.display = 'none';
    var a = el('a', 'src direct', '직접 링크(확인 안 됨)');
    a.href = dlUrl(it.fileId);
    a.target = '_blank';
    a.rel = 'noopener';
    a.title = '검증 없이 드라이브에서 바로 받습니다';
    a.style.display = 'none';   // 검증 받기가 실패했을 때만 꺼내 보인다(평소엔 화면을 어지럽히지 않게)
    btn.onclick = function () {
      if (btn.disabled) return;
      var myGen = gen;
      btn.disabled = true;
      btn.textContent = '받는 중…';
      save.style.display = 'none';
      getVerified(it).then(function (r) {
        if (myGen !== gen) return;
        var url = saveBytes(r.bytes, displayName(it), it.mime);
        btn.textContent = label + ' ✓';
        btn.setAttribute('data-level', r.level);
        if (url) {
          if (save.href && save.href.indexOf('blob:') === 0) { try { URL.revokeObjectURL(save.href); } catch (e) { /* 무시 */ } }
          save.href = url;
          save.download = displayName(it);
          save.style.display = '';
          toast('저장을 시작했습니다 · ' + LEVEL_TEXT[r.level] + '. 안 되면 "저장하기"를 누르세요');
        }
      }, function (e) {
        if (myGen !== gen) return;
        btn.textContent = label;
        if (e && e.storedBad) {
          // 보관된 사본 자체가 원본과 다름 — 직접 링크도 같은 바이트이므로 내주지 않는다
          a.style.display = 'none';
          a.removeAttribute('href');
          toast('검증 실패: 원본과 다릅니다 — 보낸 사람에게 다시 공유를 요청하세요');
        } else if (e && e.mismatch) {
          a.style.display = '';
          toast('검증 실패: 원본과 달라 저장하지 않았습니다. 잠시 후 다시 시도하거나 "직접 링크(확인 안 됨)"를 이용하세요.');
        } else {
          a.style.display = '';
          toast('받지 못했습니다. 다시 시도하거나 "직접 링크(확인 안 됨)"를 이용하세요.');
        }
        btn.setAttribute('data-failed', e && e.mismatch ? 'mismatch' : 'fetch');
      }).then(function () { if (myGen === gen) btn.disabled = false; });
    };
    parent.appendChild(btn);
    parent.appendChild(save);
    parent.appendChild(a);
  }

  /* ── 원본 받기(바이트 그대로 + 검증) ── */

  /** htmlGuard: lh3 '=d'처럼 오류·확인 페이지가 HTML로 올 수 있는 출처에서만 text/html 거부.
   *  Drive API alt=media는 파일 자신의 MIME으로 주므로(.html 파일이면 text/html) 거부하지 않는다 — 크기·해시로 검증. */
  function fetchBytes(url, htmlGuard) {
    return fetch(url, { credentials: 'omit', cache: 'no-store' }).then(function (res) {
      var ct = (res.headers.get('Content-Type') || '').toLowerCase();
      if (!res.ok || (htmlGuard && ct.indexOf('text/html') >= 0)) throw new Error('HTTP ' + res.status);
      return res.arrayBuffer();
    }).then(function (b) { return new Uint8Array(b); });
  }

  /** → Promise<{ok, why?, level?}> — 크기(알면)·SHA-256(있으면) 둘 다 맞아야 ok.
   *  level: 'hash'(해시 일치) | 'size'(크기만) | 'none'(비교할 정보 없음 — 검증 안 됨) */
  function verifyBytes(it, u8) {
    var hasSize = typeof it.size === 'number' && it.size > 0;
    if (hasSize && u8.byteLength !== it.size) return Promise.resolve({ ok: false, why: '크기 불일치' });
    var hasSha = typeof it.sha256 === 'string' && /^[0-9a-fA-F]{64}$/.test(it.sha256);
    if (!hasSha || !StashCrypto.available) return Promise.resolve({ ok: true, level: hasSize ? 'size' : 'none' });
    return StashCrypto.sha256Hex(u8).then(function (h) {
      return h === it.sha256.toLowerCase() ? { ok: true, level: 'hash' } : { ok: false, why: '해시 불일치' };
    });
  }

  /**
   * 원본 한 건: Drive API(정확한 바이트) → (이미지) lh3 '=d' → (옛 링크) 서버 vFile 순서로 시도,
   * 받을 때마다 검증. 하나라도 맞으면 {bytes, level}. 전부 실패하면 reject —
   * 받긴 했는데 안 맞은 경우 mismatch:true, 그중 정확한 바이트 출처(Drive API·vFile)가 안 맞았으면 storedBad:true
   * (보관된 사본 자체가 원본과 다름 → 직접 링크도 같은 바이트). 검증에 실패한 바이트는 절대 돌려주지 않는다.
   */
  function getVerified(it) {
    var sources = [];
    if (KEY_OK) sources.push({ exact: true, get: function () { return fetchBytes(driveMediaUrl(it.fileId), false); } });
    if (it.kind === 'image') sources.push({ exact: false, get: function () { return fetchBytes('https://lh3.googleusercontent.com/d/' + encodeURIComponent(it.fileId) + '=d', true); } });
    if (share && share.legacy) {
      var sid = SHARE_ID, tok = token;
      sources.push({ exact: true, get: function () {
        return api('vFile', { shareId: sid, token: tok, n: it.n }).then(function (r) {
          if (!r || !r.ok) throw new Error((r && r.error) || 'vFile 실패');
          return StashCrypto.b64d(r.b64);
        });
      } });
    }
    var mismatch = false, storedBad = false, lastWhy = '';
    var i = 0;
    var tryNext = function () {
      if (i >= sources.length) {
        var e = new Error(lastWhy || '받지 못함');
        e.mismatch = mismatch;
        e.storedBad = storedBad;
        return Promise.reject(e);
      }
      var src = sources[i++];
      return Promise.resolve().then(src.get).then(function (u8) {
        return verifyBytes(it, u8).then(function (v) {
          if (v.ok) return { bytes: u8, level: v.level };
          mismatch = true; lastWhy = v.why;
          if (src.exact) storedBad = true;
          return tryNext();
        });
      }, function (err) {
        if (!mismatch) lastWhy = (err && err.message) || '받지 못함';
        return tryNext();
      });
    };
    return tryNext();
  }

  /** 검증된 바이트 저장 — 자동 클릭을 시도하고 blob URL을 돌려준다(수동 '저장하기' 링크용, 10분 뒤 해제). */
  function saveBytes(u8, name, mime) {
    var blob = new Blob([u8], { type: mime || 'application/octet-stream' });
    var url;
    try { url = URL.createObjectURL(blob); } catch (e) { toast('이 브라우저에서는 저장이 안 됩니다. 다른 브라우저로 열어 주세요.'); return null; }
    var a = el('a');
    a.href = url;
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    try { a.click(); } catch (e) { /* 수동 링크로 폴백 */ }
    document.body.removeChild(a);
    setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) { /* 무시 */ } }, 10 * 60 * 1000);
    return url;
  }

  /* ── 메모 복사 ── */

  function copyText(text) {
    var done = function () { toast('메모를 복사했습니다'); };
    var fallback = function () {
      var ta = el('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      toast(ok ? '메모를 복사했습니다' : '복사하지 못했습니다. 길게 눌러 직접 선택해 주세요.');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  /* ── 라이트박스 ── */

  var lb = document.getElementById('lb');
  var lbImg = document.getElementById('lbimg');

  function openLb(it) {
    var p = lbList.indexOf(it);
    if (p >= 0) lbPos = p;
    showLb();
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function showLb() {
    var it = lbList[lbPos];
    if (!it) return;
    lbImg.removeAttribute('src');
    setImg(lbImg, fullUrl(it.fileId), it.fileId, 2400);
    updateLbCount();
  }
  /** 위치 글자만 — 업로드 중 목록이 늘어도 보던 사진은 다시 안 불러온다 */
  function updateLbCount() {
    var it = lbList[lbPos];
    if (it) document.getElementById('lbcount').textContent = pad(it.n) + '  ·  ' + (lbPos + 1) + ' / ' + lbList.length;
  }
  function moveLb(d) {
    if (lbList.length < 2) return;
    lbPos = (lbPos + d + lbList.length) % lbList.length;
    showLb();
  }
  function closeLb() {
    lb.classList.remove('open');
    lbImg.removeAttribute('src');
    document.body.style.overflow = '';
    if (panelEl && panelEl.classList.contains('open')) document.body.style.overflow = 'hidden';   // 전체 화면 상세 위에서 열었던 경우
    var it = lbList[lbPos];
    if (it && it._k && entries[it._k]) selectItem(it._k, { scroll: !narrow() });   // 보던 사진을 고른 채로
  }
  document.getElementById('lbprev').onclick = function (e) { e.stopPropagation(); moveLb(-1); };
  document.getElementById('lbnext').onclick = function (e) { e.stopPropagation(); moveLb(1); };
  document.getElementById('lbclose').onclick = function (e) { e.stopPropagation(); closeLb(); };
  lb.onclick = function (e) { if (e.target === lb) closeLb(); };
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    else if (e.key === 'ArrowLeft') moveLb(-1);
    else if (e.key === 'ArrowRight') moveLb(1);
  });
  // 스와이프 — 한 손가락 가로 이동만(두 손가락 확대는 무시)
  var tx = null, ty = null;
  lb.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    if (tx === null || !e.changedTouches.length) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    tx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) moveLb(dx < 0 ? 1 : -1);
    else if (dy > 90 && Math.abs(dy) > Math.abs(dx) * 1.5) closeLb();   // 아래로 쓸어내리면 닫기
  }, { passive: true });

  /* ── 목록으로 ── */

  var totop = document.getElementById('totop');
  totop.onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); };
  window.addEventListener('scroll', function () {
    totop.classList.toggle('show', window.scrollY > 600);
  }, { passive: true });

  /* ── ZIP 묶음 다운로드 ── */

  function setStatus(text, ratio) {
    var st = document.getElementById('dlstatus');
    if (!st) return;
    clear(st);
    if (text == null) return;
    st.appendChild(document.createTextNode(text));
    if (ratio != null) {
      var bar = el('div', 'bar');
      var fill = el('i');
      fill.style.width = Math.round(Math.max(0, Math.min(1, ratio)) * 100) + '%';
      bar.appendChild(fill);
      st.appendChild(bar);
    }
  }

  function setBusy(on) {
    busy = on;
    var a = document.getElementById('zipAll');
    if (a) a.disabled = on;
    syncPicks();
  }

  function safeFileName(s) {
    return String(s || 'Stash 공유').replace(/[\\/:*?"<>|\r\n\t]+/g, ' ').trim().slice(0, 80) || 'Stash 공유';
  }

  /**
   * ZIP — 3개씩 동시에 받아 검증한 것만 넣는다(이미지는 STORE). 합계가 ZIP_PART_MAX를 넘으면 여러 개로 나눠
   * 한 묶음씩 만들고 저장한 뒤, 사용자가 '다음 묶음 받기'를 누르면 앞 묶음을 놓고 다음을 만든다(메모리는 한 묶음치만).
   */
  function makeZip(list, isAll) {
    if (busy || !list.length) return;
    if (!window.JSZip) {
      setStatus('압축 기능을 불러오지 못했습니다. 항목별 "원본 받기"를 이용하세요.');
      return;
    }
    setBusy(true);
    list = list.map(function (it) { return Object.assign({}, it); });
    var withFile = list.filter(function (it) { return it.fileId && it.kind !== 'text'; });
    var parts = zipParts(withFile);
    var failed = [];     // 받지 못함
    var badHash = [];    // 받았지만 원본과 다름 → 제외
    var levels = { hash: 0, size: 0, none: 0 };
    var memoTxt = '';
    if (share.showMemo) {
      list.forEach(function (it) { if (it.memo) memoTxt += pad(it.n) + '\n' + it.memo + '\n\n'; });
    }
    var cur = share;
    var myGen = gen;   // 주소가 바뀌면 이 작업은 조용히 멈춘다 — 새 화면의 상태 막대·busy를 건드리지 않는다
    var stale = function () { return myGen !== gen; };
    var baseName = safeFileName(cur.title) + (isAll ? '' : ' (선택 ' + list.length + '개)');
    var prevUrl = null;

    var finish = function () {
      if (prevUrl) {
        var u = prevUrl;
        prevUrl = null;
        setTimeout(function () { try { URL.revokeObjectURL(u); } catch (e) { /* 무시 */ } }, 10 * 60 * 1000);
      }
      if (stale()) return;
      setBusy(false);
      // 끝난 알림은 아래에 떠 있으니 닫을 수 있게
      var st = document.getElementById('dlstatus');
      if (st && st.firstChild) {
        var x = el('button', 'x', '✕');
        x.type = 'button';
        x.setAttribute('aria-label', '알림 닫기');
        x.onclick = function () { setStatus(null); };
        st.insertBefore(x, st.firstChild);
      }
    };

    var runPart = function (k) {
      var items = parts[k];
      var multi = parts.length > 1;
      var tag = multi ? '(' + (k + 1) + '/' + parts.length + ') ' : '';
      var withMemo = k === 0 && !!memoTxt;
      var zip = new window.JSZip();
      var added = 0, doneCount = 0;
      var one = function (it) {
        // 파일명의 '/'·'\'는 ZIP 안에서 폴더가 되므로 바꾼다
        var fname = '원본/' + String(it.name || pad(it.n)).replace(/[\\/]+/g, '_');
        return getVerified(it).then(function (r) {
          if (stale()) return;
          // 이미 압축된 사진은 다시 압축하지 않는다(STORE) — 빠르고 바이트 그대로
          zip.file(fname, r.bytes, { binary: true, compression: it.kind === 'image' ? 'STORE' : 'DEFLATE' });
          levels[r.level] = (levels[r.level] || 0) + 1;
          added++;
        }, function (e) {
          if (stale()) return;
          if (e && e.mismatch) badHash.push(pad(it.n));
          else failed.push(pad(it.n));
        }).then(function () {
          doneCount++;
          if (!stale()) setStatus(tag + '원본 받는 중… ' + doneCount + ' / ' + items.length, doneCount / Math.max(1, items.length));
        });
      };
      var next = 0;
      var worker = function () {
        if (next >= items.length || stale()) return Promise.resolve();
        var it = items[next++];
        return one(it).then(worker);
      };
      setStatus(tag + '원본 받는 중… 0 / ' + items.length, 0);
      Promise.all([worker(), worker(), worker()]).then(function () {
        if (stale()) return null;
        if (withMemo) zip.file('메모.txt', '﻿' + memoTxt, { compression: 'DEFLATE' });
        if (!added && !withMemo) {
          if (multi) return null;   // 이 묶음은 전부 실패 — 아래에서 다음 묶음 안내
          throw new Error('받을 파일이 없습니다');
        }
        setStatus(tag + '압축 중…', 0);
        return zip.generateAsync({ type: 'blob' }, function (m) { if (!stale()) setStatus(tag + '압축 중… ' + Math.round(m.percent) + '%', m.percent / 100); });
      }).then(function (blob) {
        zip = null;   // 다음 묶음 전에 받은 바이트를 놓는다
        if (stale()) return;
        if (prevUrl) { try { URL.revokeObjectURL(prevUrl); } catch (e) { /* 무시 */ } prevUrl = null; }
        if (blob) prevUrl = saveBlob(blob, baseName + (multi ? ' (' + (k + 1) + '-' + parts.length + ')' : '') + '.zip', tag);
        else setStatus(tag + '이 묶음은 받을 수 있는 파일이 없었습니다.');
        var st = document.getElementById('dlstatus');
        if (k + 1 < parts.length && st) {
          var row = el('div');
          var go = el('button', 'btn primary', '다음 묶음 받기 (' + (k + 2) + '/' + parts.length + ')');
          go.type = 'button';
          go.id = 'zipNext';
          var stop = el('button', 'btn', '그만두기');
          stop.type = 'button';
          go.onclick = function () { if (!stale()) runPart(k + 1); };
          stop.onclick = function () {
            if (stale()) return;
            setStatus('묶음 받기를 멈췄습니다.');
            appendSummary(levels, failed, badHash);
            finish();
          };
          row.appendChild(go);
          row.appendChild(document.createTextNode(' '));
          row.appendChild(stop);
          st.appendChild(row);
          appendSummary(levels, failed, badHash);
          return;
        }
        appendSummary(levels, failed, badHash);
        finish();
      }).catch(function (e) {
        if (stale()) return;
        setStatus(tag + '묶음을 만들지 못했습니다' + (e && e.message ? ': ' + e.message : '') + '. 항목별 "원본 받기"를 이용하세요.');
        appendSummary(levels, failed, badHash);
        finish();
      });
    };
    runPart(0);
  }

  /** 검증 수준·실패 요약을 상태 칸에 덧붙인다. '원본 일치'는 전부 해시로 확인됐을 때만. */
  function appendSummary(levels, failed, badHash) {
    var st = document.getElementById('dlstatus');
    if (!st) return;
    var total = levels.hash + levels.size + levels.none;
    if (total) {
      var txt = (levels.size || levels.none)
        ? '해시 확인 ' + levels.hash + '개' + (levels.size ? ' · 크기만 확인 ' + levels.size + '개' : '') +
          (levels.none ? ' · 확인 정보 없음 ' + levels.none + '개' : '')
        : '원본 일치 확인(SHA-256) ' + levels.hash + '개';
      var v = el('div', null, txt);
      v.id = 'verifyLevels';
      st.appendChild(v);
    }
    if (badHash.length) {
      var b = el('div', 'err', '검증 실패 ' + badHash.length + '개(원본과 달라 묶음에서 뺐습니다 — 보낸 사람에게 다시 공유를 요청하세요): ' + badHash.join(', '));
      b.id = 'badhash';
      st.appendChild(b);
    }
    if (failed.length) {
      var f = el('div', 'err', '받지 못한 항목 ' + failed.length + '개: ' + failed.join(', '));
      f.id = 'dlfailed';
      st.appendChild(f);
    }
  }

  /** ZIP 저장 — 자동 클릭 + 수동 링크. 반환: blob URL(호출한 쪽이 해제) */
  function saveBlob(blob, name, tag) {
    var st = document.getElementById('dlstatus');
    var url;
    try { url = URL.createObjectURL(blob); } catch (e) { url = null; }
    if (!url) {
      setStatus('이 브라우저에서는 묶음 저장이 안 됩니다. 다른 브라우저로 열거나 항목별 "원본 받기"를 이용하세요.');
      return null;
    }
    var a = el('a');
    a.href = url;
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    try { a.click(); } catch (e) { /* 아래 수동 링크로 폴백 */ }
    document.body.removeChild(a);

    setStatus(null);
    st.appendChild(document.createTextNode((tag || '') + 'ZIP 저장을 시작했습니다 (' + fmtSize(blob.size) + '). '));
    var again = el('a', 'zipsave', '저장이 안 되면 여기를 누르세요');
    again.href = url;
    again.download = name;
    st.appendChild(again);
    st.appendChild(el('div', null, '그래도 안 되면(앱 안 브라우저 등) 다른 브라우저로 열어 주세요.'));
    return url;
  }

  /* ── 시작 ── */

  /** 주소 → {mode, id}. /<shareId>(짧은 링크) · #<m.json ID>(v2) · #<shareId>(옛) · ?s=<shareId>(옛) */
  function readId() {
    var h = (location.hash || '').replace(/^#/, '');
    try { h = decodeURIComponent(h); } catch (e) { /* 그대로 */ }
    h = h.replace(/^s=/, '').trim();
    if (ID_RE.test(h)) return { mode: 'v1', id: h };
    if (MID_RE.test(h)) return { mode: 'v2', id: h };
    var m = /[?&]s=([^&#]*)/.exec(location.search || '');
    var q = m ? m[1] : '';
    if (ID_RE.test(q)) return { mode: 'v1', id: q };
    var pm = /^\/([A-Za-z0-9]{10})\/?$/.exec(location.pathname || '');
    return pm ? { mode: 'short', id: pm[1] } : { mode: '', id: '' };
  }

  function curKey() { return SHORT_ID ? 'short:' + SHORT_ID : MODE + ':' + (MODE === 'v2' ? MID : SHARE_ID); }

  function localGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function localSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* 저장 불가 환경 무시 */ } }

  /**
   * 짧은 링크(/<shareId>) — 서버(vResolve)에 m.json ID를 물어 v2로 연다. 찾은 ID는 이 브라우저에 기억해 다음엔 서버를 안 거친다
   * (지운 공유면 m.json이 '없어짐'으로 바뀌어 있어 그대로 안내된다).
   */
  function openShort(sid) {
    var myGen = gen, k = 'stash_mid_' + sid;
    var known = localGet(k);
    if (known && MID_RE.test(known)) {
      MODE = 'v2'; MID = known;
      openV2(false);
      return;
    }
    loading();
    api('vResolve', { s: sid }).then(function (j) {
      if (myGen !== gen) return;
      if (j.ok && typeof j.mid === 'string' && MID_RE.test(j.mid)) {
        localSet(k, j.mid);
        MODE = 'v2'; MID = j.mid;
        openV2(false);
      } else if (j.code === 'notFound') {
        stateScreen('없는 링크입니다', '공유가 삭제되었거나 주소가 틀렸습니다. 보내준 사람에게 확인해 주세요.');
      } else {
        stateScreen('불러오지 못했습니다', '잠시 후 다시 시도해 주세요.', '다시 시도', function () { openShort(sid); });
      }
    }, function () {
      if (myGen !== gen) return;
      stateScreen('불러오지 못했습니다', '잠시 후 다시 시도해 주세요.', '다시 시도', function () { openShort(sid); });
    });
  }

  function start() {
    var r = readId();
    if (lb.classList.contains('open')) closeLb();
    gen++;   // 진행 중인 열기·ZIP·자동 재확인·업로드 중 다시 읽기 결과는 이제 무시된다
    anchorHold = null;
    clearTimeout(retryTimer);
    retryTimer = null; buildSince = 0;
    stopLive();
    stopWatch();
    share = null; token = null; picked = {}; entries = {}; groups = []; groupMap = {}; lbList = []; busy = false; pendingScroll = null;
    galWrap = null; panelEl = null; selKey = null; hdrSub = null; titleEl = null; upbar = null; padW = 3;
    document.body.style.overflow = '';
    headEl = null; liveEl = null; syncOn = false;
    document.title = 'Stash 공유';
    document.body.removeAttribute('data-rendered');   // 다 그려졌는지 표시(테스트·자동화용) — 새 공유는 처음부터
    window.scrollTo(0, 0);
    MODE = r.mode; SHARE_ID = ''; MID = ''; TOKEN_KEY = ''; SHORT_ID = '';
    if (r.mode === 'short') {
      SHORT_ID = r.id;
      openShort(r.id);
      return;
    }
    if (r.mode === 'v2') {
      MID = r.id;
      openV2(false);
      return;
    }
    if (r.mode === 'v1') {
      SHARE_ID = r.id;
      TOKEN_KEY = 'stash_tok_' + r.id;
      openV1(null, storeGet(TOKEN_KEY));
      return;
    }
    stateScreen('링크가 올바르지 않습니다', '보내준 사람에게 링크를 다시 확인해 달라고 해 주세요.');
  }

  window.addEventListener('hashchange', function () {
    var r = readId();
    if (r.mode + ':' + r.id !== curKey()) start();
  });
  start();
})();
</script>
</body>
</html>
