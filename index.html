<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Stash 공유 뷰어 (정적 페이지). 데이터는 Drive의 공개 매니페스트(m.json, v2) 또는 Apps Script API(옛 링크)에서 받는다 — 이 파일에는 공유 내용이 없다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline'; img-src https: data: blob:; connect-src https://script.google.com https://*.googleusercontent.com https://drive.usercontent.google.com https://www.googleapis.com; base-uri 'none'; form-action 'none'">
<title>Stash 공유</title>
<!-- 카톡·메신저 링크 미리보기(이 페이지의 제목·설명·대표 이미지를 읽어 카드로 보여 줌). 이미지 = share-viewer/og.png -->
<meta name="description" content="보내준 사진과 메모를 모아 봅니다.">
<meta property="og:site_name" content="Stash">
<meta property="og:title" content="Stash 공유 — 사진과 메모">
<meta property="og:description" content="보내준 사진과 메모를 모아 봅니다. 눌러서 보기">
<meta property="og:type" content="website">
<meta property="og:image" content="https://stash-link.web.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Stash 공유">
<meta name="twitter:card" content="summary_large_image">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<style>
  /* Stash 앱(PC) 화면과 같은 색·카드 — app/main_window.py APP_DARK_STYLE · app/gallery.py 카드 */
  :root {
    --bg: #16181d;        /* 앱 바탕 */
    --bar: #1c1f25;       /* 상태바·패널 */
    --card: #1b1e24;      /* 카드 */
    --line: #262a32;      /* 카드 테두리 */
    --line-2: #2a2e36;    /* 입력칸·구분선 */
    --line-h: #3a4150;    /* 마우스 올림 */
    --img: #0e0f12;       /* 사진 자리 */
    --field: #13151a;     /* 메모 칸 */
    --text: #e6e8ec;
    --text-2: #d2d6dd;    /* 카드 이름 */
    --dim: #b6bcc6;
    --mute: #6b7280;
    --label: #cbd5e1;     /* 상세 패널 소제목 */
    --accent: #3b9eff;
    --accent-h: #1d6fd6;
    --accent-bg: #14243a;
    --uncat: #565d68;     /* 미분류 점 */
    --live: #4ade80;
    --danger: #f87171;
    --warn: #fbbf24;
    --mono: Consolas, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    font-size: 13px; line-height: 1.55; -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; }
  a { color: var(--accent); }
  .wrap { max-width: 1480px; margin: 0 auto; padding: 0 20px 60px; }

  /* 상태 화면 */
  .state { max-width: 420px; margin: 18vh auto 0; text-align: center; padding: 0 8px; }
  .state h2 { font-size: 18px; font-weight: 700; margin: 0 0 8px; }
  .state p { color: var(--dim); margin: 0 0 18px; }
  .pw-form { display: flex; gap: 8px; }
  .pw-form input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 10px 12px; color: var(--text);
    border: 1px solid var(--line-2); border-radius: 8px; background: var(--field);
  }
  .pw-form input:focus { outline: none; border-color: var(--accent); background: #1a1d24; }
  .err { color: var(--danger); font-size: 13px; min-height: 1.6em; margin-top: 8px; }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid var(--line-2); border-top-color: var(--accent); animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2);
    background: transparent; color: var(--dim); cursor: pointer; text-decoration: none;
    font-size: 13px; white-space: nowrap;
  }
  .btn:hover { color: var(--text); border-color: var(--line-h); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
  .btn.primary:hover { background: var(--accent-h); border-color: var(--accent-h); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.small { padding: 5px 10px; font-size: 12px; }

  /* 위 막대 — 제목·개수·실시간·다운로드(스크롤해도 붙어 있음) */
  header.top {
    position: sticky; top: 0; z-index: 8; margin: 0 -20px 16px; padding: 12px 20px;
    background: rgba(22, 24, 29, .96); border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  }
  .brand {
    width: 30px; height: 30px; border-radius: 8px; flex: none; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px;
  }
  .ttl { min-width: 0; flex: 1 1 260px; }
  header.top h1 { font-size: 16px; font-weight: 800; margin: 0; line-height: 1.35; overflow-wrap: anywhere; }
  header.top .sub { color: var(--mute); font-size: 12px; }
  p.empty { color: var(--dim); text-align: center; margin-top: 12vh; }

  /* 업로드 중 막대(보낸 사람이 아직 올리는 중) — 위 막대 맨 위 줄 */
  .upbar { flex-basis: 100%; margin: -4px 0 2px; font-size: 12px; color: #86efac; }
  .upbar .bar { height: 3px; background: rgba(74, 222, 128, .15); border-radius: 2px; overflow: hidden; margin-top: 5px; }
  .upbar .bar i { display: block; height: 100%; width: 0; background: var(--live); transition: width .4s; }
  .upbar.stalled { color: var(--warn); }
  .upbar.stalled .bar i { background: var(--warn); }

  /* 실시간 공유 표시 */
  .livebadge {
    display: inline-flex; align-items: center; gap: 7px; margin-top: 5px; padding: 2px 10px;
    font-size: 12px; color: var(--live); background: rgba(74, 222, 128, .08);
    border: 1px solid rgba(74, 222, 128, .28); border-radius: 999px;
  }
  .livebadge i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--live); flex: none;
    animation: livepulse 2.4s ease-in-out infinite;
  }
  @keyframes livepulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .livebadge i, .spinner { animation: none; } }

  /* 다운로드 */
  .dlbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .dlbar .tip { color: var(--mute); font-size: 12px; }
  /* 받기 진행·결과 — 아래에 떠 있는 알림(스크롤해도 보임) */
  .dlstatus {
    position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 12;
    width: min(560px, calc(100vw - 24px)); padding: 10px 14px; border-radius: 10px;
    background: #20242c; border: 1px solid var(--line-h); box-shadow: 0 6px 24px rgba(0, 0, 0, .45);
    font-size: 12px; color: var(--dim);
  }
  .dlstatus:empty { display: none; }
  .dlstatus .x { float: right; margin: -4px -6px 0 8px; border: 0; background: transparent; color: var(--mute); font-size: 16px; cursor: pointer; }
  .dlstatus .bar { height: 4px; background: var(--line-2); border-radius: 2px; overflow: hidden; margin: 6px 0 2px; }
  .dlstatus .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .dlstatus .err, .links .err { margin-top: 4px; min-height: 0; }
  .dlstatus .zipsave { color: var(--accent); font-weight: 700; }
  .hint {
    font-size: 12px; color: var(--dim); background: var(--accent-bg); border: 1px dashed #24486e;
    border-radius: 8px; padding: 8px 10px; margin-bottom: 14px;
  }
  .hint .btn { margin-top: 8px; }

  /* 본문: 왼쪽 갤러리 + 오른쪽 상세(앱의 상세 패널) */
  .main { display: grid; grid-template-columns: minmax(0, 1fr) clamp(300px, 30vw, 400px); gap: 20px; align-items: start; }
  .gallery { min-width: 0; }
  .grp + .grp { margin-top: 10px; }
  .ghead { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; padding: 8px 4px 4px; font-size: 14px; font-weight: 800; }
  .ghead .gdot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; }
  .ghead .gdot.uncat { background: var(--uncat); }
  .ghead .gname { overflow-wrap: anywhere; }
  .ghead .gcnt { color: var(--mute); font-weight: 500; font-size: 13px; margin-right: auto; white-space: nowrap; }

  /* 마소너리 — 폭=열 너비, 높이=사진 비율(앱과 같이 0.5~2배로 제한) + 아래 이름·크기 */
  .mgrid { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); grid-auto-rows: 4px; column-gap: 14px; }
  .card {
    position: relative; margin-bottom: 14px; display: flex; flex-direction: column; overflow: hidden; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; outline: none;
  }
  .card { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  .card:hover { border-color: var(--line-h); }
  .card.cur { border-color: #56657d; }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card.sel .ib::after { content: ""; position: absolute; inset: 0; background: rgba(59, 158, 255, .14); pointer-events: none; }
  .card:focus-visible { border-color: var(--accent); }
  .gallery { user-select: none; -webkit-user-select: none; }
  /* 빈 곳을 끌어 여러 장 고르기(앱의 박스 선택) */
  .rubber { position: absolute; z-index: 9; border: 1px solid var(--accent); background: rgba(59, 158, 255, .14); border-radius: 2px; pointer-events: none; }
  /* 여러 장 골랐을 때 아래에 떠 있는 막대 */
  .selbar {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 12;
    display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 16px; border-radius: 999px;
    background: #20242c; border: 1px solid var(--line-h); box-shadow: 0 6px 24px rgba(0, 0, 0, .45);
    font-size: 13px; white-space: nowrap; max-width: calc(100vw - 24px);
  }
  .selbar[hidden] { display: none; }
  .selbar .cnt { color: var(--text); font-weight: 700; margin-right: 4px; }
  .card .ib { position: relative; flex: none; background: var(--img); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card .ib img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .card .num {
    position: absolute; left: 7px; top: 7px; z-index: 1; padding: 0 6px; border-radius: 4px;
    background: rgba(0, 0, 0, .6); color: #fff; font: 700 11px/18px var(--mono);
  }
  .card .lbl { height: 46px; flex: none; padding: 6px 10px 0; min-width: 0; }
  .card .nm { color: var(--text-2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .dm { color: var(--mute); font: 11px/18px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 텍스트·파일 카드(정사각, 앱처럼 왼쪽 색 띠) */
  .card .ib.txt, .card .ib.file { align-items: stretch; justify-content: flex-start; flex-direction: column; text-align: left; padding: 10px 12px 12px 18px; }
  .card .ib.txt { background: #1a1a1d; }
  .card .ib.file { background: #1d1f24; align-items: center; justify-content: center; text-align: center; gap: 4px; }
  .card .ib.txt::before, .card .ib.file::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #a78bfa;
  }
  .card .ib.file::before { background: #fb923c; }
  .card .tlbl { color: var(--dim); font-size: 11px; font-weight: 700; margin: 22px 0 4px; }
  .card .tbody { color: var(--text); font-size: 12px; line-height: 1.5; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
  .card .fext { color: #fb923c; font-size: 22px; font-weight: 900; letter-spacing: .5px; }
  .card .fname { color: var(--text); font-size: 12px; font-weight: 700; overflow-wrap: anywhere; max-height: 3.2em; overflow: hidden; }
  .card .fsize { color: var(--dim); font-size: 11px; }

  /* 상세 패널 — 고른 항목을 크게 + 메모 전문 */
  .panel {
    position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow: auto;
    background: var(--bar); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
  }
  .panel .pnav { display: none; }
  .panel .pv {
    background: var(--img); border-radius: 8px; min-height: 160px; overflow: hidden; cursor: zoom-in;
    display: flex; align-items: center; justify-content: center; touch-action: pan-y pinch-zoom;
  }
  .panel .pv img { width: auto; height: auto; max-width: 100%; max-height: 52vh; display: block; object-fit: contain; }
  .panel .phead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 12px 0 2px; }
  .panel .pn { font: 700 15px var(--mono); }
  .panel .pdate { color: var(--mute); font-size: 12px; }
  .panel .pdim { color: var(--mute); font: 11px var(--mono); margin-left: auto; }
  .panel .plbl { color: var(--label); font-size: 11px; font-weight: 700; margin: 14px 0 6px; display: flex; align-items: center; gap: 8px; }
  .panel .plbl .btn { margin-left: auto; }
  .panel .memo {
    white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal; background: var(--field);
    border: 1px solid var(--line-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.65; color: var(--text);
  }
  .panel .memo.empty { color: var(--mute); }
  .panel .pmeta { color: var(--mute); font-size: 12px; margin-top: 12px; overflow-wrap: anywhere; }
  .panel .pempty { color: var(--mute); text-align: center; padding: 48px 10px; }
  .panel .pmulti { color: var(--accent); font-size: 12px; font-weight: 700; margin: 0 0 10px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  .links .src { font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
  .links .direct { font-size: 12px; }
  .links .save { font-size: 12px; font-weight: 700; color: var(--accent); }
  .filebox {
    width: 100%; padding: 30px 16px; background: #1d1f24; border: 1px solid var(--line); border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  }
  .filebox .fext { color: #fb923c; font-size: 26px; font-weight: 900; }
  .filebox .fname { font-weight: 700; overflow-wrap: anywhere; }
  .filebox .fmeta { color: var(--mute); font-size: 12px; }

  .totop {
    position: fixed; right: 14px; bottom: 70px; z-index: 5; padding: 9px 13px; border-radius: 20px;
    background: var(--accent); color: #fff; border: 0; font-size: 13px; cursor: pointer; opacity: 0; pointer-events: none;
    transition: opacity .2s; box-shadow: 0 2px 10px rgba(0, 0, 0, .4);
  }
  .totop.show { opacity: .92; pointer-events: auto; }

  /* 라이트박스(크게 보기) */
  .lb {
    position: fixed; inset: 0; z-index: 20; background: rgba(8, 9, 11, .96); display: none;
    align-items: center; justify-content: center; touch-action: pan-y pinch-zoom;
  }
  .lb.open { display: flex; }
  .lb img { max-width: 100vw; max-height: 100vh; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; }
  .lb .lbbtn {
    position: absolute; background: rgba(255, 255, 255, .12); color: #fff; border: 0; cursor: pointer;
    width: 46px; height: 46px; border-radius: 50%; font-size: 22px; line-height: 46px; text-align: center; padding: 0;
  }
  .lb .lbbtn:hover { background: rgba(255, 255, 255, .25); }
  .lb .prev { left: 12px; top: 50%; transform: translateY(-50%); }
  .lb .next { right: 12px; top: 50%; transform: translateY(-50%); }
  .lb .close { right: 12px; top: 12px; }
  .lb .count { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; color: #ddd; font-size: 13px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30;
    background: #2a2e36; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px;
    border: 1px solid var(--line-h); opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: .97; }

  /* 좁은 화면 — 상세는 카드를 눌렀을 때 전체 화면으로(←/→·스와이프로 넘김) */
  @media (max-width: 819px) {
    .wrap { padding: 0 12px 60px; }
    header.top { position: relative; margin: 0 -12px 12px; padding: 10px 12px; }   /* 폰은 붙여 두지 않음 — 사진 볼 자리 */
    .livebadge .lx { display: none; }
    .main { grid-template-columns: minmax(0, 1fr); }
    .panel {
      display: none; position: fixed; inset: 0; z-index: 15; max-height: none;
      border: 0; border-radius: 0; padding: 0 14px 28px; overflow: auto; background: var(--bg);
    }
    .panel.open { display: block; }
    .panel .pnav {
      display: flex; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 2;
      margin: 0 -14px 10px; padding: 10px 14px; background: rgba(22, 24, 29, .97); border-bottom: 1px solid var(--line);
    }
    .panel .pnav .sp { flex: 1; }
    .panel .pnav .ppos { color: var(--dim); font: 12px var(--mono); min-width: 64px; text-align: center; }
    .panel .pv img { max-height: 70vh; }
    .lb .prev, .lb .next { display: none; }   /* 폰은 스와이프 */
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="state"><div class="spinner"></div><p>불러오는 중…</p></div>
</div>
<button class="totop" id="totop" type="button">목록 ↑</button>
<div class="lb" id="lb" role="dialog" aria-modal="true">
  <img id="lbimg" alt="">
  <button class="lbbtn prev" id="lbprev" type="button" aria-label="이전">‹</button>
  <button class="lbbtn next" id="lbnext" type="button" aria-label="다음">›</button>
  <button class="lbbtn close" id="lbclose" type="button" aria-label="닫기">✕</button>
  <div class="count" id="lbcount"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ==CRYPTO-BEGIN==
/*
 * v2 비밀번호 공유 복호화 — 서버(Code.gs encryptManifest_)와 바이트 단위로 같아야 한다(CONTRACT.md §6.2).
 *   dk = PBKDF2-HMAC-SHA256(utf8(pw), salt, iter, 32B)
 *   encKey = HMAC(dk,"enc"), macKey = HMAC(dk,"mac")
 *   블록 i = HMAC(encKey, iv || uint32be(i)), 평문 = 암호문 XOR 키스트림
 *   mac = HMAC(macKey, iv || 암호문) — 복호화 전에 상수 시간 비교, 다르면 비밀번호 틀림
 */
var StashCrypto = (function () {
  'use strict';
  var C = (typeof self !== 'undefined' && self.crypto) || (typeof globalThis !== 'undefined' && globalThis.crypto) || null;
  var subtle = C && C.subtle;

  function utf8(s) { return new TextEncoder().encode(String(s)); }
  function b64d(s) {
    var bin = atob(String(s));
    var u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function b64e(u) {
    var s = '';
    for (var i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function hex(buf) {
    var u = new Uint8Array(buf), s = '';
    for (var i = 0; i < u.length; i++) s += (u[i] < 16 ? '0' : '') + u[i].toString(16);
    return s;
  }
  function concat(a, b) {
    var o = new Uint8Array(a.length + b.length);

  /** 분류 이름 → 묶음(없으면 만들어 맨 뒤에 붙인다 — 순서는 sortGroups가 맞춤). 앱처럼 묶음 머리말은 늘 보인다. */
