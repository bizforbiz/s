<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Stash 공유 뷰어 (정적 페이지). 데이터는 Drive의 공개 매니페스트(m.json, v2) 또는 Apps Script API(옛 링크)에서 받는다 — 이 파일에는 공유 내용이 없다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline'; img-src https: data: blob:; connect-src https://script.google.com https://*.googleusercontent.com https://drive.usercontent.google.com https://www.googleapis.com; base-uri 'none'; form-action 'none'">
<title>Stash 공유</title>
<meta property="og:title" content="Stash 공유">
<meta property="og:description" content="받은 링크로 사진과 메모를 봅니다.">
<meta property="og:type" content="website">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<style>
  :root {
    --bg: #f6f5f2;
    --paper: #ffffff;
    --ink: #1f1f1f;
    --muted: #6b6b6b;
    --line: #e4e2dc;
    --accent: #1f1f1f;
    --memo-dot: #2e9d5b;
    --focus: #2b5bd7;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.6; -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; }
  a { color: var(--focus); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 16px 80px; }

  /* 상태 화면 */
  .state { max-width: 420px; margin: 16vh auto 0; text-align: center; padding: 0 8px; }
  .state h2 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  .state p { color: var(--muted); margin: 0 0 18px; }
  .pw-form { display: flex; gap: 8px; }
  .pw-form input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 11px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--paper);
  }
  .pw-form input:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
  .err { color: var(--danger); font-size: 14px; min-height: 1.6em; margin-top: 8px; }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--ink); animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); cursor: pointer; text-decoration: none;
    font-size: 14px; white-space: nowrap;
  }
  .btn:hover { border-color: #c9c6be; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.small { padding: 5px 10px; font-size: 13px; }

  /* 머리말 */
  header.top { margin-bottom: 22px; }
  header.top h1 { font-size: 24px; line-height: 1.35; margin: 0 0 4px; font-weight: 650; word-break: keep-all; overflow-wrap: anywhere; }
  header.top .sub { color: var(--muted); font-size: 14px; }

  /* 다운로드 막대 */
  .dlbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 10px 12px; margin-bottom: 14px; background: var(--paper);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .dlbar label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; margin-right: auto; }
  .dlstatus { width: 100%; font-size: 13px; color: var(--muted); }
  .dlstatus:empty { display: none; }
  .dlstatus .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 6px 0 2px; }
  .dlstatus .bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .2s; }
  .hint { font-size: 13px; color: var(--muted); background: #fbfaf7; border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 14px; }

  /* 번호 썸네일 인덱스 */
  .index { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 40px; }
  .cell {
    position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden; cursor: pointer; aspect-ratio: 1 / 1; display: block; padding: 0; text-align: left;
  }
  .cell:focus-visible { outline: 2px solid var(--focus); }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; background: #eeece7; }
  .cell .ph {
    width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; padding: 10px; color: var(--muted); font-size: 12px; text-align: center; background: #faf9f6;
  }
  .cell .ph .ico { font-size: 26px; line-height: 1; }
  .cell .ph .snip { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; word-break: break-all; color: var(--ink); }
  .cell .num {
    position: absolute; left: 6px; top: 6px; background: rgba(255,255,255,.92); color: var(--ink);
    font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 10px; font-variant-numeric: tabular-nums;
  }
  .cell .dot {
    position: absolute; right: 7px; top: 8px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--memo-dot); box-shadow: 0 0 0 2px #fff;
  }
  .cell .pick {
    position: absolute; right: 2px; bottom: 2px; width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .cell .pick input { width: 20px; height: 20px; margin: 0; cursor: pointer; accent-color: var(--ink); }
  .cell.picked { outline: 3px solid var(--ink); outline-offset: -3px; }

  /* 상세: 큰 이미지 왼쪽 / 메모 전문 오른쪽 */
  .item {
    display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 24px;
    padding: 26px 0; border-top: 1px solid var(--line); scroll-margin-top: 12px;
    /* 화면 밖 상세는 그리기 생략(항목 수백 개여도 스크롤이 가볍게). 한 번 그려진 높이는 기억(auto) */
    content-visibility: auto; contain-intrinsic-size: auto 640px;
  }
  .item.solo { grid-template-columns: minmax(0, 1fr); }
  .item .media { display: flex; flex-direction: column; align-items: center; }
  .item .media img {
    max-width: 100%; max-height: 82vh; height: auto; display: block; border-radius: 6px;
    background: #eeece7; cursor: zoom-in;
  }
  .filebox {
    width: 100%; padding: 34px 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  }
  .filebox .ico { font-size: 40px; line-height: 1; }
  .filebox .fname { font-weight: 600; overflow-wrap: anywhere; }
  .filebox .fmeta { color: var(--muted); font-size: 13px; }
  .side { min-width: 0; }
  .side .head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .side .head .n { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .side .head .date { color: var(--muted); font-size: 13px; margin-right: auto; }
  .memo {
    white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal;
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
    font-size: 15px; line-height: 1.7;
  }
  .memo.empty { color: var(--muted); font-style: normal; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .links .src { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .links.center { justify-content: center; margin-top: 6px; }
  .links .direct { font-size: 12px; }
  .links .save { font-size: 13px; font-weight: 600; color: var(--ink); }
  .hint .btn { margin-top: 8px; }

  /* 분류 묶음 제목 */
  .ghead { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px; font-size: 17px; font-weight: 650; }
  .ghead:first-child { margin-top: 0; }
  .ghead .gname { word-break: keep-all; overflow-wrap: anywhere; }
  .ghead .gcnt { color: var(--muted); font-size: 13px; font-weight: 500; margin-right: auto; }
  .ghead .gpick { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .ghead .gpick input { accent-color: var(--ink); }
  .indexwrap { margin-bottom: 40px; }
  .indexwrap .index { margin-bottom: 8px; }
  .dghead { margin: 0; padding: 34px 0 12px; border-top: 2px solid var(--ink); scroll-margin-top: 12px; font-size: 19px; }

  .totop {
    position: fixed; right: 14px; bottom: 16px; z-index: 5; padding: 9px 13px; border-radius: 20px;
    background: var(--ink); color: #fff; border: 0; font-size: 13px; cursor: pointer; opacity: 0; pointer-events: none;
    transition: opacity .2s; box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  .totop.show { opacity: .9; pointer-events: auto; }

  /* 라이트박스 */
  .lb {
    position: fixed; inset: 0; z-index: 20; background: rgba(12,12,12,.94); display: none;
    align-items: center; justify-content: center; touch-action: pan-y pinch-zoom;
  }
  .lb.open { display: flex; }
  .lb img { max-width: 100vw; max-height: 100vh; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; }
  .lb .lbbtn {
    position: absolute; background: rgba(255,255,255,.12); color: #fff; border: 0; cursor: pointer;
    width: 46px; height: 46px; border-radius: 50%; font-size: 22px; line-height: 46px; text-align: center; padding: 0;
  }
  .lb .lbbtn:hover { background: rgba(255,255,255,.25); }
  .lb .prev { left: 12px; top: 50%; transform: translateY(-50%); }
  .lb .next { right: 12px; top: 50%; transform: translateY(-50%); }
  .lb .close { right: 12px; top: 12px; }
  .lb .count { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; color: #ddd; font-size: 13px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30;
    background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: .95; }

  @media (max-width: 720px) {
    .wrap { padding-top: 20px; }
    header.top h1 { font-size: 20px; }
    .index { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .item { grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 20px 0; }
    .item .media img { max-height: none; }
    .lb .prev, .lb .next { display: none; }   /* 폰은 스와이프 */
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="state"><div class="spinner"></div><p>불러오는 중…</p></div>
</div>
<button class="totop" id="totop" type="button">목록 ↑</button>
<div class="lb" id="lb" role="dialog" aria-modal="true">
  <img id="lbimg" alt="">
  <button class="lbbtn prev" id="lbprev" type="button" aria-label="이전">‹</button>
  <button class="lbbtn next" id="lbnext" type="button" aria-label="다음">›</button>
  <button class="lbbtn close" id="lbclose" type="button" aria-label="닫기">✕</button>
  <div class="count" id="lbcount"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ==CRYPTO-BEGIN==
/*
 * v2 비밀번호 공유 복호화 — 서버(Code.gs encryptManifest_)와 바이트 단위로 같아야 한다(CONTRACT.md §6.2).
 *   dk = PBKDF2-HMAC-SHA256(utf8(pw), salt, iter, 32B)
 *   encKey = HMAC(dk,"enc"), macKey = HMAC(dk,"mac")
 *   블록 i = HMAC(encKey, iv || uint32be(i)), 평문 = 암호문 XOR 키스트림
 *   mac = HMAC(macKey, iv || 암호문) — 복호화 전에 상수 시간 비교, 다르면 비밀번호 틀림
 */
var StashCrypto = (function () {
  'use strict';
  var C = (typeof self !== 'undefined' && self.crypto) || (typeof globalThis !== 'undefined' && globalThis.crypto) || null;
  var subtle = C && C.subtle;

  function utf8(s) { return new TextEncoder().encode(String(s)); }
  function b64d(s) {
    var bin = atob(String(s));
    var u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function b64e(u) {
    var s = '';
    for (var i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function hex(buf) {
    var u = new Uint8Array(buf), s = '';
    for (var i = 0; i < u.length; i++) s += (u[i] < 16 ? '0' : '') + u[i].toString(16);
    return s;
  }
  function concat(a, b) {
    var o = new Uint8Array(a.length + b.length);
    o.set(a, 0); o.set(b, a.length);
    return o;
  }
  function hmacKey(raw) { return subtle.importKey('raw', raw, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']); }
  function sign(key, msg) { return subtle.sign('HMAC', key, msg).then(function (b) { return new Uint8Array(b); }); }
  function hmac(raw, msg) { return hmacKey(raw).then(function (k) { return sign(k, msg); }); }
  function ctEq(a, b) {
    if (a.length !== b.length) return false;
    var r = 0;
    for (var i = 0; i < a.length; i++) r |= a[i] ^ b[i];
    return r === 0;
  }

  /** 비밀번호 → dk(32B) */
  function deriveKey(pw, saltB64, iter) {
    return subtle.importKey('raw', utf8(pw), 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64d(saltB64), iterations: iter }, k, 256);
    }).then(function (bits) { return new Uint8Array(bits); });
  }

  function macError() { var e = new Error('mac'); e.code = 'mac'; return e; }

  /** env(m.json) + dk → 평문 객체. MAC이 안 맞으면 code:'mac' */
  function decrypt(env, dk) {
    var iv, ct, mac;
    try { iv = b64d(env.iv); ct = b64d(env.data); mac = b64d(env.mac); }
    catch (e) { var be = new Error('bad'); be.code = 'bad'; return Promise.reject(be); }
    if (iv.length !== 16 || mac.length !== 32) return Promise.reject(macError());
    return Promise.all([hmac(dk, utf8('enc')), hmac(dk, utf8('mac'))]).then(function (keys) {
      return hmac(keys[1], concat(iv, ct)).then(function (calc) {
        if (!ctEq(calc, mac)) throw macError();
        return hmacKey(keys[0]);
      });
    }).then(function (encKey) {
      var nBlocks = Math.ceil(ct.length / 32);
      var out = new Uint8Array(ct.length);
      var block = function (i) {
        var b = new Uint8Array(20);
        b.set(iv, 0);
        b[16] = (i >>> 24) & 255; b[17] = (i >>> 16) & 255; b[18] = (i >>> 8) & 255; b[19] = i & 255;
        return sign(encKey, b).then(function (ks) {
          var off = i * 32, end = Math.min(32, ct.length - off);
          for (var j = 0; j < end; j++) out[off + j] = ct[off + j] ^ ks[j];
        });
      };
      var next = 0;
      var step = function () {
        if (next >= nBlocks) return Promise.resolve();
        var ps = [];
        for (var c = 0; c < 512 && next < nBlocks; c++) ps.push(block(next++));
        return Promise.all(ps).then(step);
      };
      return step().then(function () {
        return JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(out));
      });
    });
  }

  function sha256Hex(u8) { return subtle.digest('SHA-256', u8).then(hex); }

  return { available: !!subtle, utf8: utf8, b64d: b64d, b64e: b64e, deriveKey: deriveKey, decrypt: decrypt, sha256Hex: sha256Hex };
})();

(function () {
  'use strict';

  // Stash 공유 서버(Apps Script 웹앱 /exec). 배포 주소가 바뀌면 여기만 고친다. (옛 링크 vOpen/vFile·열람수 vPing)
  var API_URL = 'https://script.google.com/macros/s/AKfycbxvFvuB0KAovb436Je0oa8GHBb_i7sbnfUE5Na1cSNyAgHAtRNK0wK7Bd1bIPnctEVjag/exec';
  // Google Drive API 키(공개 파일 읽기 전용) — v2 링크(#<m.json ID>)와 원본 받기에 쓴다. SETUP.md 7번 참고.
  // GCP 콘솔에서 'Google Drive API'만 허용 + HTTP 리퍼러 https://bizforbiz.github.io/* 로 제한해서 넣는다.
  var DRIVE_API_KEY = 'AIzaSyAK-yPss5VFI5CThSQVoAx9-Gie26UKEa0';
  var DRIVE_FILES = 'https://www.googleapis.com/drive/v3/files/';
  var ID_RE = /^[A-Za-z0-9]{10}$/;            // 옛 링크: shareId(10자)
  var MID_RE = /^[A-Za-z0-9_-]{25,60}$/;      // v2 링크: m.json 파일 ID
  var RETRIES = 4;         // 구글 echo 단계 되튐(실측 ~30%) — 같은 reqId로 재시도(서버가 중복 실행 안 함)

  var CHUNK = 40;
  var BUILD_RETRY_MS = 5000;

  var KEY_OK = /^[A-Za-z0-9_-]{20,}$/.test(DRIVE_API_KEY) && DRIVE_API_KEY.indexOf('REPLACE_') !== 0;

  var MODE = '';           // 'v1' | 'v2'
  var SHARE_ID = '';       // v1 shareId
  var MID = '';            // v2 m.json ID
  var TOKEN_KEY = '';
  var app = document.getElementById('app');
  var share = null;        // {title, createdAt, expiresAt, allowDownload, showMemo, items, order, legacy}
  var token = null;
  var picked = {};         // n → true (ZIP 선택)
  var cells = {};          // n → {cell, cb}
  var groupBoxes = [];     // [{cb, items}]
  var busy = false;        // ZIP 진행 중

  var lbList = [];         // 라이트박스 대상(이미지 항목)
  var lbPos = 0;
  var retryTimer = null;   // building 자동 재확인
  var pendingScroll = null;

  /* ── 공통 ── */

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = String(text);
    return e;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  /* ── 서버 호출 (옛 링크) ── */

  function newReqId() {
    var a = new Uint8Array(16);
    try { window.crypto.getRandomValues(a); }

    return s;
  }

  /** 한 번 보내기 → 응답 JSON(ok 필드 있는 객체). 끊김·HTML·시간 초과는 reject(재시도 대상). */

    // Content-Type text/plain — CORS 프리플라이트 없이 보내기 위함.
    return fetch(API_URL, {
      method: 'POST',
      body: body,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      credentials: 'omit',

    document.body.removeAttribute('data-rendered');
    var items = share.items.slice().sort(function (a, b) { return (a.n || 0) - (b.n || 0); });
    share.items = items;
    var groups = groupItems(items);
    var grouped = groups.length > 1;
    var order = [];
    groups.forEach(function (g) { order = order.concat(g.items); });
    share.order = order;
    lbList = order.filter(isImage);

    // 머리말: 제목 · 개수 · 공유일 · 만료일
    var head = el('header', 'top');
    head.appendChild(el('h1', null, share.title || 'Stash 공유'));
    var sub = [items.length + '개 항목'];
    if (grouped) sub.push(groups.length + '개 분류');
    if (share.createdAt) sub.push(fmtDate(share.createdAt) + ' 공유');
    sub.push(share.expiresAt ? fmtDate(share.expiresAt) + '까지 열람 가능' : '기한 없음');
    head.appendChild(el('div', 'sub', sub.join(' · ')));
    app.appendChild(head);

    if (!items.length) {
      app.appendChild(el('p', 'sub', '공유된 항목이 없습니다.'));
      document.body.setAttribute('data-rendered', '1');
      return;
    }

    if (share.allowDownload) app.appendChild(buildDlBar(order));

    var tasks = [];
    var idxWrap = el('div', 'indexwrap');
    var detWrap = el('div', 'details');
    app.appendChild(idxWrap);
    app.appendChild(detWrap);

    // 번호 썸네일 인덱스(분류가 여럿이면 분류 제목 + 개수)
    groups.forEach(function (g, gi) {
      var grid = el('div', 'index');
      if (grouped) idxWrap.appendChild(buildGroupHead(g, gi, true));
      idxWrap.appendChild(grid);
      g.items.forEach(function (it) { tasks.push(function () { grid.appendChild(buildCell(it)); }); });
    });
    // 한 장씩 상세(같은 순서)
    groups.forEach(function (g, gi) {
      if (grouped) tasks.push(function () { detWrap.appendChild(buildGroupHead(g, gi, false)); });
      g.items.forEach(function (it) {
        tasks.push(function () {
          detWrap.appendChild(buildDetail(it));
          if (pendingScroll === it.n) { pendingScroll = null; scrollToItem(it.n); }
        });
      });
    });
    runTasks(tasks, gen);
  }

  function buildGroupHead(g, gi, inIndex) {
    var h = el('h2', inIndex ? 'ghead' : 'ghead dghead');
    if (!inIndex) h.id = 'g-' + gi;
    h.appendChild(el('span', 'gname', g.label));
    h.appendChild(el('span', 'gcnt', g.items.length + '개'));
    if (inIndex) {
      var go = el('button', 'btn small glink', '상세 ↓');
      go.type = 'button';
      go.onclick = function () {
        var t = document.getElementById('g-' + gi);
        if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
        else if (g.items[0]) { pendingScroll = g.items[0].n; }
      };
      h.appendChild(go);
      if (share.allowDownload) {
        var lab = el('label', 'gpick');
        var cb = el('input');
        cb.type = 'checkbox';
        cb.setAttribute('aria-label', g.label + ' 전체 선택');
        lab.appendChild(cb);
        lab.appendChild(document.createTextNode('선택'));
        cb.onchange = function () {
          g.items.forEach(function (it) { if (cb.checked) picked[it.n] = true; else delete picked[it.n]; });
          syncPicks();
        };
        groupBoxes.push({ cb: cb, items: g.items });
        h.appendChild(lab);
      }
    }
    return h;
  }

  /** 앱 안 브라우저(카카오톡 등)에서 외부 브라우저로 여는 주소. 없으면 null(메뉴 안내만). */
  function externalOpenUrl() {
    var href = location.href;
    if (IS_KAKAO) return 'kakaotalk://web/openExternal?url=' + encodeURIComponent(href);
    if (IS_ANDROID && /^https:\/\//i.test(href)) {
      return 'intent://' + href.replace(/^https:\/\//i, '') + '#Intent;scheme=https;package=com.android.chrome;end';
    }
    return null;
  }

  function sumSize(list) {
    var t = 0;
    list.forEach(function (it) { if (it.fileId && it.kind !== 'text' && it.size > 0) t += it.size; });
    return t;
  }

  /** ZIP 한 개 상한 — 넘으면 여러 개로 나눠 하나씩 만들고 저장(휴대폰 브라우저 메모리 부족으로 탭이 죽지 않게) */
  function zipParts(withFile) {
    var parts = [[]], acc = 0;
    withFile.forEach(function (it) {
      var sz = it.size > 0 ? it.size : 0;
      var cur = parts[parts.length - 1];
      if (cur.length && acc + sz > ZIP_PART_MAX) { parts.push([]); acc = 0; cur = parts[parts.length - 1]; }
      cur.push(it);
      acc += sz;
    });
    return parts;
  }

  function zipAllLabel(order) {
    var total = sumSize(order);
    if (!total) return '전체 ZIP';
    var withFile = order.filter(function (it) { return it.fileId && it.kind !== 'text'; });
    var n = zipParts(withFile).length;
    return '전체 ZIP (' + fmtSize(total) + (n > 1 ? ' · ' + n + '개로 나눔' : '') + ')';
  }

  function buildDlBar(order) {
    var frag = document.createDocumentFragment();
    if (IS_INAPP) {
      var hint = el('div', 'hint');
      hint.id = 'inappHint';
      var ext = externalOpenUrl();
      hint.appendChild(document.createTextNode(
        '앱 안 브라우저에서는 사진 저장·묶음(ZIP) 다운로드가 안 될 수 있습니다. ' +
        (ext ? '아래 버튼으로 다른 브라우저에서 열어 주세요.' : '메뉴의 "다른 브라우저로 열기"(또는 "Safari로 열기")를 이용해 주세요.')));
      if (ext) {
        var ob = el('a', 'btn primary', '다른 브라우저로 열기');
        ob.id = 'openExternal';
        ob.href = ext;
        hint.appendChild(el('br'));
        hint.appendChild(ob);
      }
      frag.appendChild(hint);
    }
    var bar = el('div', 'dlbar');
    var allLabel = el('label');
    var all = el('input');
    all.type = 'checkbox';
    all.id = 'pickAll';
    allLabel.appendChild(all);
    allLabel.appendChild(document.createTextNode('전체 선택'));
    all.onchange = function () {
      order.forEach(function (it) { if (all.checked) picked[it.n] = true; else delete picked[it.n]; });
      syncPicks();
    };
    var selBtn = el('button', 'btn', '선택 ZIP');
    selBtn.type = 'button';
    selBtn.id = 'zipSel';
    selBtn.disabled = true;
    selBtn.onclick = function () {
      makeZip(order.filter(function (it) { return picked[it.n]; }), false);
    };
    var allBtn = el('button', 'btn primary', zipAllLabel(order));
    allBtn.type = 'button';
    allBtn.id = 'zipAll';
    allBtn.onclick = function () { makeZip(order, true); };
    var st = el('div', 'dlstatus');
    st.id = 'dlstatus';
    bar.appendChild(allLabel);
    bar.appendChild(selBtn);
    bar.appendChild(allBtn);
    bar.appendChild(st);
    frag.appendChild(bar);
    return frag;
  }

  function syncPicks() {
    var count = 0;
    var items = share.items;
    items.forEach(function (it) {
      var on = !!picked[it.n];
      if (on) count++;
      var c = cells[it.n];
      if (c) {
        c.cell.classList.toggle('picked', on);
        if (c.cb) c.cb.checked = on;
      }
    });
    groupBoxes.forEach(function (g) {
      g.cb.checked = g.items.every(function (it) { return picked[it.n]; });
    });
    var sel = document.getElementById('zipSel');
    if (sel) {
      sel.textContent = count ? '선택 ZIP (' + count + ')' : '선택 ZIP';
      sel.disabled = busy || !count;
    }
    var all = document.getElementById('pickAll');
    if (all) all.checked = count > 0 && count === items.length;
  }

  function scrollToItem(n) {
    var target = document.getElementById('i-' + n);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    else pendingScroll = n;   // 아직 안 그려짐 — 그려지는 순간 이동
  }

  function buildCell(it) {
    var cell = el('div', 'cell');
    cell.id = 'c-' + it.n;
    cell.tabIndex = 0;
    cell.setAttribute('role', 'button');
    cell.setAttribute('aria-label', pad(it.n) + '번으로 이동');

    if (isImage(it)) {
      var img = el('img');
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      setImg(img, thumbUrl(it.fileId), it.fileId, 400);
      cell.appendChild(img);
    } else if (it.kind === 'text') {
      var ph = el('div', 'ph');
      ph.appendChild(el('div', 'snip', (it.memo || '').slice(0, 120) || '(메모)'));
      cell.appendChild(ph);
    } else {
      var ph2 = el('div', 'ph');
      ph2.appendChild(el('div', 'ico', '📄'));
      ph2.appendChild(el('div', 'snip', displayName(it)));
      cell.appendChild(ph2);
    }

    cell.appendChild(el('span', 'num', pad(it.n)));
    if (share.showMemo && it.memo) {
      var dot = el('span', 'dot');
      dot.title = '메모 있음';
      cell.appendChild(dot);
    }

    var cb = null;
    if (share.allowDownload) {
      var pick = el('label', 'pick');
      cb = el('input');
      cb.type = 'checkbox';
      cb.checked = !!picked[it.n];
      cb.setAttribute('aria-label', pad(it.n) + '번 선택');
      pick.appendChild(cb);
      pick.onclick = function (e) { e.stopPropagation(); };
      cb.onchange = function () {
        if (cb.checked) picked[it.n] = true; else delete picked[it.n];
        syncPicks();
      };
      cell.appendChild(pick);
    }
    if (picked[it.n]) cell.classList.add('picked');
    cells[it.n] = { cell: cell, cb: cb };

    var go = function () { scrollToItem(it.n); };
    cell.onclick = go;
    cell.onkeydown = function (e) { if (e.key === 'Enter') go(); };
    return cell;
  }

  /** 표시용 파일명: "001_abc.png" → "abc.png" */
  function displayName(it) {
    var nm = it.name || '';
    return nm.replace(/^\d{3,4}_/, '') || '파일';
  }

  function buildDetail(it) {
    var sec = el('section', 'item');
    sec.id = 'i-' + it.n;
    var hasMedia = it.kind !== 'text' && !!it.fileId;
    var hasSide = share.showMemo || it.kind === 'text' || hasMedia;

    if (hasMedia) {
      var media = el('div', 'media');
      if (isImage(it)) {
        var img = el('img');
        img.alt = pad(it.n);
        img.loading = 'lazy';
        img.decoding = 'async';
        if (it.width && it.height) { img.width = it.width; img.height = it.height; }
        setImg(img, bigUrl(it.fileId), it.fileId, 1600);
        img.onclick = function () { openLb(it.n); };
        media.appendChild(img);
      } else {
        var fb = el('div', 'filebox');
        fb.appendChild(el('div', 'ico', '📄'));
        fb.appendChild(el('div', 'fname', displayName(it)));
        var fm = [it.mime, fmtSize(it.size)].filter(Boolean).join(' · ');
        if (fm) fb.appendChild(el('div', 'fmeta', fm));
        if (share.allowDownload) {
          var row = el('div', 'links center');
          appendDownload(row, it, '파일 받기', 'btn primary');
          fb.appendChild(row);
        }
        media.appendChild(fb);
      }
      sec.appendChild(media);
    }

    if (hasSide) {
      var side = el('div', 'side');
      var hd = el('div', 'head');
      hd.appendChild(el('span', 'n', pad(it.n)));
      hd.appendChild(el('span', 'date', it.createdAt || ''));
      side.appendChild(hd);

      if (share.showMemo || it.kind === 'text') {
        if (it.memo) {
          var copy = el('button', 'btn small', '메모 복사');
          copy.type = 'button';
          copy.onclick = function () { copyText(it.memo); };
          hd.appendChild(copy);
          side.appendChild(el('div', 'memo', it.memo));   // 전문 — 잘라내지 않음
        } else {
          side.appendChild(el('div', 'memo empty', '메모 없음'));
        }
      }

      var links = el('div', 'links');
      if (share.allowDownload && hasMedia && isImage(it)) {
        appendDownload(links, it, '원본 받기', 'btn small');
        if (it.size) links.appendChild(el('span', 'src', fmtSize(it.size)));
      }
      if (isHttp(it.sourceUrl)) {
        var src = el('a', 'src', '출처: ' + it.sourceUrl);
        src.href = it.sourceUrl;
        src.target = '_blank';
        src.rel = 'noopener noreferrer';
        links.appendChild(src);
      }
      if (links.firstChild) side.appendChild(links);
      sec.appendChild(side);
    }

    if (!hasMedia || !hasSide) sec.classList.add('solo');
    return sec;
  }

  /** 검증 수준 → 안내 문구 */
  var LEVEL_TEXT = { hash: '원본 일치(SHA-256) 확인', size: '크기만 확인(해시 정보 없음)', none: '확인 정보 없음(검증 안 됨)' };

  /**
   * 항목별 받기 — 원본 바이트를 받아 크기·SHA-256 확인 후 저장.
   * 저장은 자동 클릭 + 눈에 보이는 '저장하기' 링크(앱 안 브라우저·사용자 동작 만료 대비).
   * 직접 링크(Drive)는 검증 없는 수동 폴백 — 보관된 사본 자체가 원본과 다르면(storedBad) 숨긴다.
   */
  function appendDownload(parent, it, label, cls) {
    var btn = el('button', cls, label);
    btn.type = 'button';
    btn.className += ' dl1';
    var save = el('a', 'src save', '저장하기');
    save.style.display = 'none';
    var a = el('a', 'src direct', '직접 링크(확인 안 됨)');
    a.href = dlUrl(it.fileId);
    a.target = '_blank';
    a.rel = 'noopener';
    a.title = '검증 없이 드라이브에서 바로 받습니다';
    btn.onclick = function () {
      if (btn.disabled) return;
      var myGen = gen;
      btn.disabled = true;
      btn.textContent = '받는 중…';
      save.style.display = 'none';
      getVerified(it).then(function (r) {
        if (myGen !== gen) return;
        var url = saveBytes(r.bytes, displayName(it), it.mime);
        btn.textContent = label + ' ✓';
        btn.setAttribute('data-level', r.level);
        if (url) {
          if (save.href && save.href.indexOf('blob:') === 0) { try { URL.revokeObjectURL(save.href); } catch (e) { /* 무시 */ } }
          save.href = url;
          save.download = displayName(it);
          save.style.display = '';
          toast('저장을 시작했습니다 · ' + LEVEL_TEXT[r.level] + '. 안 되면 "저장하기"를 누르세요');
        }
      }, function (e) {
        if (myGen !== gen) return;
        btn.textContent = label;
        if (e && e.storedBad) {
          // 보관된 사본 자체가 원본과 다름 — 직접 링크도 같은 바이트이므로 내주지 않는다
          a.style.display = 'none';
          a.removeAttribute('href');
          toast('검증 실패: 원본과 다릅니다 — 보낸 사람에게 다시 공유를 요청하세요');
        } else if (e && e.mismatch) {
          toast('검증 실패: 원본과 달라 저장하지 않았습니다. 잠시 후 다시 시도하거나 "직접 링크(확인 안 됨)"를 이용하세요.');
        } else {
          toast('받지 못했습니다. 다시 시도하거나 "직접 링크(확인 안 됨)"를 이용하세요.');
        }
        btn.setAttribute('data-failed', e && e.mismatch ? 'mismatch' : 'fetch');
      }).then(function () { if (myGen === gen) btn.disabled = false; });
    };
    parent.appendChild(btn);
    parent.appendChild(save);
    parent.appendChild(a);
  }

  /* ── 원본 받기(바이트 그대로 + 검증) ── */

  /** htmlGuard: lh3 '=d'처럼 오류·확인 페이지가 HTML로 올 수 있는 출처에서만 text/html 거부.
   *  Drive API alt=media는 파일 자신의 MIME으로 주므로(.html 파일이면 text/html) 거부하지 않는다 — 크기·해시로 검증. */
  function fetchBytes(url, htmlGuard) {
    return fetch(url, { credentials: 'omit', cache: 'no-store' }).then(function (res) {
      var ct = (res.headers.get('Content-Type') || '').toLowerCase();
      if (!res.ok || (htmlGuard && ct.indexOf('text/html') >= 0)) throw new Error('HTTP ' + res.status);
      return res.arrayBuffer();
    }).then(function (b) { return new Uint8Array(b); });
  }

  /** → Promise<{ok, why?, level?}> — 크기(알면)·SHA-256(있으면) 둘 다 맞아야 ok.
   *  level: 'hash'(해시 일치) | 'size'(크기만) | 'none'(비교할 정보 없음 — 검증 안 됨) */
  function verifyBytes(it, u8) {
    var hasSize = typeof it.size === 'number' && it.size > 0;
    if (hasSize && u8.byteLength !== it.size) return Promise.resolve({ ok: false, why: '크기 불일치' });
    var hasSha = typeof it.sha256 === 'string' && /^[0-9a-fA-F]{64}$/.test(it.sha256);
    if (!hasSha || !StashCrypto.available) return Promise.resolve({ ok: true, level: hasSize ? 'size' : 'none' });
    return StashCrypto.sha256Hex(u8).then(function (h) {
      return h === it.sha256.toLowerCase() ? { ok: true, level: 'hash' } : { ok: false, why: '해시 불일치' };
    });
  }

  /**
   * 원본 한 건: Drive API(정확한 바이트) → (이미지) lh3 '=d' → (옛 링크) 서버 vFile 순서로 시도,
   * 받을 때마다 검증. 하나라도 맞으면 {bytes, level}. 전부 실패하면 reject —
   * 받긴 했는데 안 맞은 경우 mismatch:true, 그중 정확한 바이트 출처(Drive API·vFile)가 안 맞았으면 storedBad:true
   * (보관된 사본 자체가 원본과 다름 → 직접 링크도 같은 바이트). 검증에 실패한 바이트는 절대 돌려주지 않는다.
   */
  function getVerified(it) {
    var sources = [];
    if (KEY_OK) sources.push({ exact: true, get: function () { return fetchBytes(driveMediaUrl(it.fileId), false); } });
    if (it.kind === 'image') sources.push({ exact: false, get: function () { return fetchBytes('https://lh3.googleusercontent.com/d/' + encodeURIComponent(it.fileId) + '=d', true); } });
    if (share && share.legacy) {
      var sid = SHARE_ID, tok = token;
      sources.push({ exact: true, get: function () {
        return api('vFile', { shareId: sid, token: tok, n: it.n }).then(function (r) {
          if (!r || !r.ok) throw new Error((r && r.error) || 'vFile 실패');
          return StashCrypto.b64d(r.b64);
        });
      } });
    }
    var mismatch = false, storedBad = false, lastWhy = '';
    var i = 0;
    var tryNext = function () {
      if (i >= sources.length) {
        var e = new Error(lastWhy || '받지 못함');
        e.mismatch = mismatch;
        e.storedBad = storedBad;
        return Promise.reject(e);
      }
      var src = sources[i++];
      return Promise.resolve().then(src.get).then(function (u8) {
        return verifyBytes(it, u8).then(function (v) {
          if (v.ok) return { bytes: u8, level: v.level };
          mismatch = true; lastWhy = v.why;
          if (src.exact) storedBad = true;
          return tryNext();
        });
      }, function (err) {
        if (!mismatch) lastWhy = (err && err.message) || '받지 못함';
        return tryNext();
      });
    };
    return tryNext();
  }

  /** 검증된 바이트 저장 — 자동 클릭을 시도하고 blob URL을 돌려준다(수동 '저장하기' 링크용, 10분 뒤 해제). */
  function saveBytes(u8, name, mime) {
    var blob = new Blob([u8], { type: mime || 'application/octet-stream' });
    var url;
    try { url = URL.createObjectURL(blob); } catch (e) { toast('이 브라우저에서는 저장이 안 됩니다. 다른 브라우저로 열어 주세요.'); return null; }
    var a = el('a');
    a.href = url;
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    try { a.click(); } catch (e) { /* 수동 링크로 폴백 */ }
    document.body.removeChild(a);
    setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) { /* 무시 */ } }, 10 * 60 * 1000);
    return url;
  }

  /* ── 메모 복사 ── */

  function copyText(text) {
    var done = function () { toast('메모를 복사했습니다'); };
    var fallback = function () {
      var ta = el('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      toast(ok ? '메모를 복사했습니다' : '복사하지 못했습니다. 길게 눌러 직접 선택해 주세요.');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  /* ── 라이트박스 ── */

  var lb = document.getElementById('lb');
  var lbImg = document.getElementById('lbimg');

  function openLb(n) {
    for (var i = 0; i < lbList.length; i++) if (lbList[i].n === n) { lbPos = i; break; }
    showLb();
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function showLb() {
    var it = lbList[lbPos];
    if (!it) return;
    lbImg.removeAttribute('src');
    setImg(lbImg, fullUrl(it.fileId), it.fileId, 2400);
    document.getElementById('lbcount').textContent = pad(it.n) + '  ·  ' + (lbPos + 1) + ' / ' + lbList.length;
  }
  function moveLb(d) {
    if (lbList.length < 2) return;
    lbPos = (lbPos + d + lbList.length) % lbList.length;
    showLb();
  }
  function closeLb() {
    lb.classList.remove('open');
    lbImg.removeAttribute('src');
    document.body.style.overflow = '';
    var it = lbList[lbPos];
    var target = it && document.getElementById('i-' + it.n);
    if (target) target.scrollIntoView({ block: 'start' });
  }
  document.getElementById('lbprev').onclick = function (e) { e.stopPropagation(); moveLb(-1); };
  document.getElementById('lbnext').onclick = function (e) { e.stopPropagation(); moveLb(1); };
  document.getElementById('lbclose').onclick = function (e) { e.stopPropagation(); closeLb(); };
  lb.onclick = function (e) { if (e.target === lb) closeLb(); };
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    else if (e.key === 'ArrowLeft') moveLb(-1);
    else if (e.key === 'ArrowRight') moveLb(1);
  });
  // 스와이프 — 한 손가락 가로 이동만(두 손가락 확대는 무시)
  var tx = null, ty = null;
  lb.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    if (tx === null || !e.changedTouches.length) return;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    tx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) moveLb(dx < 0 ? 1 : -1);
    else if (dy > 90 && Math.abs(dy) > Math.abs(dx) * 1.5) closeLb();   // 아래로 쓸어내리면 닫기
  }, { passive: true });

  /* ── 목록으로 ── */

  var totop = document.getElementById('totop');
  totop.onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); };
  window.addEventListener('scroll', function () {
    totop.classList.toggle('show', window.scrollY > 600);
  }, { passive: true });

  /* ── ZIP 묶음 다운로드 ── */

  function setStatus(text, ratio) {
    var st = document.getElementById('dlstatus');
    if (!st) return;
    clear(st);
    if (text == null) return;
    st.appendChild(document.createTextNode(text));
    if (ratio != null) {
      var bar = el('div', 'bar');
      var fill = el('i');
      fill.style.width = Math.round(Math.max(0, Math.min(1, ratio)) * 100) + '%';
      bar.appendChild(fill);
      st.appendChild(bar);
    }
  }

  function setBusy(on) {
    busy = on;
    var a = document.getElementById('zipAll');
    if (a) a.disabled = on;
    syncPicks();
  }

  function safeFileName(s) {
    return String(s || 'Stash 공유').replace(/[\\/:*?"<>|\r\n\t]+/g, ' ').trim().slice(0, 80) || 'Stash 공유';
  }

  /**
   * ZIP — 3개씩 동시에 받아 검증한 것만 넣는다(이미지는 STORE). 합계가 ZIP_PART_MAX를 넘으면 여러 개로 나눠
   * 한 묶음씩 만들고 저장한 뒤, 사용자가 '다음 묶음 받기'를 누르면 앞 묶음을 놓고 다음을 만든다(메모리는 한 묶음치만).
   */
  function makeZip(list, isAll) {
    if (busy || !list.length) return;
    if (!window.JSZip) {
      setStatus('압축 기능을 불러오지 못했습니다. 항목별 "원본 받기"를 이용하세요.');
      return;
    }
    setBusy(true);
    var withFile = list.filter(function (it) { return it.fileId && it.kind !== 'text'; });
    var parts = zipParts(withFile);
    var failed = [];     // 받지 못함
    var badHash = [];    // 받았지만 원본과 다름 → 제외
    var levels = { hash: 0, size: 0, none: 0 };
    var memoTxt = '';
    if (share.showMemo) {
      list.forEach(function (it) { if (it.memo) memoTxt += pad(it.n) + '\n' + it.memo + '\n\n'; });
    }
    var cur = share;
    var myGen = gen;   // 주소가 바뀌면 이 작업은 조용히 멈춘다 — 새 화면의 상태 막대·busy를 건드리지 않는다
    var stale = function () { return myGen !== gen; };
    var baseName = safeFileName(cur.title) + (isAll ? '' : ' (선택 ' + list.length + '개)');
    var prevUrl = null;

    var finish = function () {
      if (prevUrl) {
        var u = prevUrl;
        prevUrl = null;
        setTimeout(function () { try { URL.revokeObjectURL(u); } catch (e) { /* 무시 */ } }, 10 * 60 * 1000);
      }
      if (!stale()) setBusy(false);
    };

    var runPart = function (k) {
      var items = parts[k];
      var multi = parts.length > 1;
      var tag = multi ? '(' + (k + 1) + '/' + parts.length + ') ' : '';
      var withMemo = k === 0 && !!memoTxt;
      var zip = new window.JSZip();
      var added = 0, doneCount = 0;
      var one = function (it) {
        // 파일명의 '/'·'\'는 ZIP 안에서 폴더가 되므로 바꾼다
        var fname = '원본/' + String(it.name || pad(it.n)).replace(/[\\/]+/g, '_');
        return getVerified(it).then(function (r) {
          if (stale()) return;
          // 이미 압축된 사진은 다시 압축하지 않는다(STORE) — 빠르고 바이트 그대로
          zip.file(fname, r.bytes, { binary: true, compression: it.kind === 'image' ? 'STORE' : 'DEFLATE' });
          levels[r.level] = (levels[r.level] || 0) + 1;
          added++;
        }, function (e) {
          if (stale()) return;
          if (e && e.mismatch) badHash.push(pad(it.n));
          else failed.push(pad(it.n));
        }).then(function () {
          doneCount++;
          if (!stale()) setStatus(tag + '원본 받는 중… ' + doneCount + ' / ' + items.length, doneCount / Math.max(1, items.length));
        });
      };
      var next = 0;
      var worker = function () {
        if (next >= items.length || stale()) return Promise.resolve();
        var it = items[next++];
        return one(it).then(worker);
      };
      setStatus(tag + '원본 받는 중… 0 / ' + items.length, 0);
      Promise.all([worker(), worker(), worker()]).then(function () {
        if (stale()) return null;
        if (withMemo) zip.file('메모.txt', '﻿' + memoTxt, { compression: 'DEFLATE' });
        if (!added && !withMemo) {
          if (multi) return null;   // 이 묶음은 전부 실패 — 아래에서 다음 묶음 안내
          throw new Error('받을 파일이 없습니다');
        }
        setStatus(tag + '압축 중…', 0);
        return zip.generateAsync({ type: 'blob' }, function (m) { if (!stale()) setStatus(tag + '압축 중… ' + Math.round(m.percent) + '%', m.percent / 100); });
      }).then(function (blob) {
        zip = null;   // 다음 묶음 전에 받은 바이트를 놓는다
        if (stale()) return;
        if (prevUrl) { try { URL.revokeObjectURL(prevUrl); } catch (e) { /* 무시 */ } prevUrl = null; }
        if (blob) prevUrl = saveBlob(blob, baseName + (multi ? ' (' + (k + 1) + '-' + parts.length + ')' : '') + '.zip', tag);
        else setStatus(tag + '이 묶음은 받을 수 있는 파일이 없었습니다.');
        var st = document.getElementById('dlstatus');
        if (k + 1 < parts.length && st) {
          var row = el('div');
          var go = el('button', 'btn primary', '다음 묶음 받기 (' + (k + 2) + '/' + parts.length + ')');
          go.type = 'button';
          go.id = 'zipNext';
          var stop = el('button', 'btn', '그만두기');
          stop.type = 'button';
          go.onclick = function () { if (!stale()) runPart(k + 1); };
          stop.onclick = function () {
            if (stale()) return;
            setStatus('묶음 받기를 멈췄습니다.');
            appendSummary(levels, failed, badHash);
            finish();
          };
          row.appendChild(go);
          row.appendChild(document.createTextNode(' '));
          row.appendChild(stop);
          st.appendChild(row);
          appendSummary(levels, failed, badHash);
          return;
        }
        appendSummary(levels, failed, badHash);
        finish();
      }).catch(function (e) {
        if (stale()) return;
        setStatus(tag + '묶음을 만들지 못했습니다' + (e && e.message ? ': ' + e.message : '') + '. 항목별 "원본 받기"를 이용하세요.');
        appendSummary(levels, failed, badHash);
        finish();
      });
    };
    runPart(0);
  }

  /** 검증 수준·실패 요약을 상태 칸에 덧붙인다. '원본 일치'는 전부 해시로 확인됐을 때만. */
  function appendSummary(levels, failed, badHash) {
    var st = document.getElementById('dlstatus');
    if (!st) return;
    var total = levels.hash + levels.size + levels.none;
    if (total) {
      var txt = (levels.size || levels.none)
        ? '해시 확인 ' + levels.hash + '개' + (levels.size ? ' · 크기만 확인 ' + levels.size + '개' : '') +
          (levels.none ? ' · 확인 정보 없음 ' + levels.none + '개' : '')
        : '원본 일치 확인(SHA-256) ' + levels.hash + '개';
      var v = el('div', null, txt);
      v.id = 'verifyLevels';
      st.appendChild(v);
    }
    if (badHash.length) {
      var b = el('div', 'err', '검증 실패 ' + badHash.length + '개(원본과 달라 묶음에서 뺐습니다 — 보낸 사람에게 다시 공유를 요청하세요): ' + badHash.join(', '));
      b.id = 'badhash';
      st.appendChild(b);
    }
    if (failed.length) {
      var f = el('div', 'err', '받지 못한 항목 ' + failed.length + '개: ' + failed.join(', '));
      f.id = 'dlfailed';
      st.appendChild(f);
    }
  }

  /** ZIP 저장 — 자동 클릭 + 수동 링크. 반환: blob URL(호출한 쪽이 해제) */
  function saveBlob(blob, name, tag) {
    var st = document.getElementById('dlstatus');
    var url;
    try { url = URL.createObjectURL(blob); } catch (e) { url = null; }
    if (!url) {
      setStatus('이 브라우저에서는 묶음 저장이 안 됩니다. 다른 브라우저로 열거나 항목별 "원본 받기"를 이용하세요.');
      return null;
    }
    var a = el('a');
    a.href = url;
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    try { a.click(); } catch (e) { /* 아래 수동 링크로 폴백 */ }
    document.body.removeChild(a);

    setStatus(null);
    st.appendChild(document.createTextNode((tag || '') + 'ZIP 저장을 시작했습니다 (' + fmtSize(blob.size) + '). '));
    var again = el('a', 'zipsave', '저장이 안 되면 여기를 누르세요');
    again.href = url;
    again.download = name;
    st.appendChild(again);
    st.appendChild(el('div', null, '그래도 안 되면(앱 안 브라우저 등) 다른 브라우저로 열어 주세요.'));
    return url;
  }

  /* ── 시작 ── */

  /** 주소 → {mode, id}. #<m.json ID>(v2) · #<shareId>(옛) · ?s=<shareId>(옛) */
  function readId() {
    var h = (location.hash || '').replace(/^#/, '');
    try { h = decodeURIComponent(h); } catch (e) { /* 그대로 */ }
    h = h.replace(/^s=/, '').trim();
    if (ID_RE.test(h)) return { mode: 'v1', id: h };
    if (MID_RE.test(h)) return { mode: 'v2', id: h };
    var m = /[?&]s=([^&#]*)/.exec(location.search || '');
    var q = m ? m[1] : '';
    return ID_RE.test(q) ? { mode: 'v1', id: q } : { mode: '', id: '' };
  }

  function curKey() { return MODE + ':' + (MODE === 'v2' ? MID : SHARE_ID); }

  function start() {
    var r = readId();
    if (lb.classList.contains('open')) closeLb();
    gen++;   // 진행 중인 열기·ZIP·자동 재확인 결과는 이제 무시된다
    clearTimeout(retryTimer);
    share = null; token = null; picked = {}; cells = {}; groupBoxes = []; lbList = []; busy = false; pendingScroll = null;
    document.title = 'Stash 공유';
    document.body.removeAttribute('data-rendered');   // 다 그려졌는지 표시(테스트·자동화용) — 새 공유는 처음부터
    window.scrollTo(0, 0);
    MODE = r.mode; SHARE_ID = ''; MID = ''; TOKEN_KEY = '';
    if (r.mode === 'v2') {
      MID = r.id;
      openV2(false);
      return;
    }
    if (r.mode === 'v1') {
      SHARE_ID = r.id;
      TOKEN_KEY = 'stash_tok_' + r.id;
      openV1(null, storeGet(TOKEN_KEY));
      return;
    }
    stateScreen('링크가 올바르지 않습니다', '보내준 사람에게 링크를 다시 확인해 달라고 해 주세요.');
  }

  window.addEventListener('hashchange', function () {
    var r = readId();
    if (r.mode + ':' + r.id !== curKey()) start();
  });
  start();
})();
</script>
</body>
</html>
